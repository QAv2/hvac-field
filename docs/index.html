<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Dx</title>
<meta name="description" content="Offline HVAC/R field diagnostics: type the symptoms, get the likely causes and the next best check.">
<meta name="theme-color" content="#0d1215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Dx">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button class="brand" data-act="home" aria-label="Home">Field <b>Dx</b></button>
  <button class="sys" id="sysname" data-act="setup"></button>
  <button class="icon-btn" data-act="tools" aria-label="Calculators" title="Calculators">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>
  </button>
  <button class="icon-btn" data-act="theme" aria-label="Switch light or dark" title="Light / dark">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div class="helper" id="helper"><i class="dot"></i><span id="helpertext">Loading the knowledge base…</span></div>
<div id="sheet"></div>
<noscript><p style="padding:16px">Field Dx needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
