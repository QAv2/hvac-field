module: synonyms
title: Search synonyms — words techs use for the same thing (first word in each group is the one the index uses)
notes: |
  Each group maps every variant (one word or several) to its first word before searching, in both the typed
  text and the knowledge base. Only true equivalents belong here; words that differ in degree (frost vs ice)
  stay separate and are handled by the features' own phrases.

