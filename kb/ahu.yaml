module: ahu
title: Air handling and ventilation — fans, drives, coils (air and water side), mixing box, economizer, controls,
  building pressure, heat and energy recovery (HRV / ERV)
notes: |
  The temperature logic follows the NIST APAR rule set (NISTIR 6964 Table 3.1), paraphrased: mixed air must sit
  between return and outdoor air (rules 26/27); with both coils off, supply air equals mixed air plus fan heat
  (rule 7), in heating it must be at least that (rule 1), and in mechanical cooling it cannot exceed it (rules
  11/16); outdoor-air fraction = (MAT − RAT)/(OAT − RAT) should match the design minimum fraction when the
  dampers sit at minimum, about 100 % when they are commanded full open and about 0 % when closed, once return
  and outdoor differ by 10 °F or more (rules 2/18). A part-open blade position is not an air fraction. APAR's
  fixed band of 30 points (εf = 0.3) is its worst case at the smallest allowed spread (εt ÷ ΔTmin), so the
  allowance here shrinks as the return-to-outdoor spread grows. A valve pinned at 100 % with setpoint not met
  means the coil can't deliver (rules 3/4/13/19), supply off setpoint by more than about 3 °F (εt = 1.7 °C,
  rule 25), economizer mode vs outdoor temperature (rules 5/8/9/15), heating and cooling at once or heating
  with the dampers open (rules 21–24), and mode cycling (rule 28). The refrigerant side of a DX coil belongs to
  the refrigeration modules; this file covers the air side and the water/glycol control of coils.
  Cold-climate items (snow in the intake, freezestats, glycol strength, stratification) are first-class here
  because the user runs air handlers against −40 °F outdoor air; everything also fits ordinary US equipment.
  Makeup-air units (100 % outdoor air) and heat- or energy-recovery ventilators (HRV / ERV) are told apart by
  the unit-type question: the mixing-box items switch off for them, and the recovery-core causes (frost and
  defrost, wheel drive, bypass damper, plugged core, condensate, flow balance) switch on for an HRV / ERV.
  The recovery items are our own field logic, not a published rule set.

context:
  - id: fan_drive
    ask: How is the fan driven?
    hint: Belt and sheaves, or the wheel on the motor shaft (direct drive / plenum fan).
    systems: [ahu]
    options:
      - {id: belt, label: Belt drive}
      - {id: direct, label: Direct drive}
  - id: vfd
    ask: Is there a VFD (variable-frequency drive) on the fan?
    hint: A drive with a keypad and a frequency readout. Otherwise a starter or contactor runs the motor.
    systems: [ahu]
    options:
      - {id: 'yes', label: 'Yes — VFD'}
      - {id: 'no', label: 'No — starter or contactor'}
  - id: oa_type
    ask: What kind of unit is it — does it mix return air with outdoor air, take 100 % outdoor air, or recover heat
      from the exhaust?
    hint: A makeup-air unit (MAU) has no return damper and no mixing box. An HRV or ERV passes outdoor air and
      exhaust air through a core or wheel without mixing them. The shares are rough, for units where this is
      not answered.
    systems: [ahu]
    options:
      - id: mixed
        label: Mixes return and outdoor air
        p: 0.75
        words: [mixing box, mixed air, return damper]
      - id: all_oa
        label: 100 % outdoor air (makeup air)
        p: 0.15
        words: [makeup air, make-up air, mau, 100 percent outdoor air, dedicated outdoor air, doas]
      - id: hrv
        label: Heat- or energy-recovery ventilator (HRV / ERV)
        p: 0.1
        words: [hrv, erv, heat recovery, energy recovery, recovery ventilator, enthalpy wheel, heat wheel,
          recovery wheel]
  - id: economizer
    ask: Does it have an economizer (outdoor and return dampers that modulate for free cooling)?
    hint: Modulating outdoor and return dampers that open up for free cooling. A fixed minimum-position damper
      on its own answers No.
    systems: [ahu]
    options:
      - {id: 'yes', label: 'Yes'}
      - {id: 'no', label: 'No'}
  - id: heat_coil
    ask: What heats the air?
    hint: Glycol loops — check the fill records or test a sample; ethylene and propylene glycol freeze differently.
    systems: [ahu]
    options:
      - {id: water, label: Hot-water coil}
      - {id: eg, label: Glycol coil — ethylene glycol}
      - {id: pg, label: Glycol coil — propylene glycol}
      - {id: steam, label: Steam coil}
      - {id: electric, label: Electric heat}
      - {id: none, label: No heating coil}
  - id: cool_coil
    ask: What cools the air?
    systems: [ahu]
    options:
      - {id: chw, label: Chilled-water coil}
      - {id: dx, label: DX (refrigerant) coil}
      - {id: none, label: No cooling coil}

features:
  # ---------------- fan, drive and motor ----------------
  - id: ahu.fan
    name: Fan
    ask: Is the fan running?
    how: Listen at the motor and watch the shaft or belt from outside the guard, or look through an inspection
      window or the inlet screen. A motor that runs with the wheel still means the belt (belt drive) or the wheel
      or coupling (direct drive). To look inside — stop the fan, lock out and tag it at the disconnect (on a VFD
      also wait out the bus-discharge time and verify zero), let the wheel stop, then open the door.
    caution: Never open an access door or guard with the fan running — suction can pin the door shut, pressure
      can throw it open, and a spinning wheel takes a hand or a sleeve. "Power off" is not enough; lock out and
      tag, and wait for the wheel to stop.
    systems: [ahu]
    states:
      running: Running, wheel turning
      off: Not running — motor silent
      motor_only: Motor runs but the wheel isn't turning
      trips: Starts then trips, or hums and won't start
    normal: running
    base: {running: 0.85, off: 0.08, motor_only: 0.03, trips: 0.04}
    cost: 1
    phrases:
      off: [fan not running, fan off, fan dead, supply fan not running, supply fan off, fan wont start, fan won't
          start, fan not coming on, no fan, blower not running, exhaust fan not running, mau not running, unit off,
          fan stopped, fan down]
      motor_only: [motor runs but no air, motor running wheel not turning, belt off, wheel not turning, motor
          spins fan doesnt, fan not turning motor running, coupling failed, coupling broken, coupling gone,
          direct drive wheel not turning]
      trips: [fan trips, trips on overload, overload trips, fan hums, fan humming, fan starts and trips, fan
          kicks out, starter trips, drive trips, vfd trips, trips out, keeps tripping]
      running: [fan running, fan is running, fan on]
  - id: ahu.starter
    name: Motor starter
    ask: What is the motor starter doing (with a run command present)?
    how: Look at the contactor and the overload relay's trip flag, then meter line voltage in and out across each
      pole.
    caution: Live voltage — qualified person only, with a properly rated meter and PPE, and the panel door closed
      where possible. Otherwise lock out and use continuity.
    systems: [ahu]
    requires: {vfd: ['no']}
    ask_if: {ahu.fan: ['off', trips]}
    states:
      ok: Pulled in, full voltage out on every pole
      not_pulling: Not pulled in
      overload: Overload relay tripped
      burnt: Pulled in but a pole or fuse is open — voltage lost across it
    normal: ok
    cost: 2
    needs: meter
    phrases:
      not_pulling: [starter not pulling in, contactor not pulling in, starter not energized, no coil voltage,
          starter wont pull in, starter won't pull in]
      overload: [overload tripped, overload relay tripped, ol tripped, overloads tripped, thermal overload,
          overload reset, heaters tripped]
      burnt: [burnt contacts, pitted contacts, blown fuse in starter, lost a pole, bad contactor, voltage drop
          across contactor, burnt pole, pole burnt, welded contacts, welded pole, contactor burnt, contactor
          pitted, open pole on contactor]
  - id: ahu.vfd_status
    name: VFD
    ask: What does the VFD show?
    how: Read the keypad or display with the drive door closed. Note any fault text, and whether it shows
      Hand/Local or Auto and a run command.
    caution: Keep the drive door closed. To open a drive or touch its terminals, lock out, wait the maker's
      discharge time (several minutes) and verify zero volts on the DC bus — the capacitors stay charged after
      power is cut.
    systems: [ahu]
    requires: {vfd: ['yes']}
    states:
      running: Running, following its speed command
      fault: Showing a fault
      not_enabled: Powered up but stopped — no run command, in local/Hand, or stop/enable open
      no_display: Dead — no display at all
    normal: running
    cost: 1
    phrases:
      fault: [vfd fault, drive fault, vfd faulted, drive faulted, vfd alarm, drive alarm, fault code, vfd error,
          drive tripped, vfd tripped, fault light]
      not_enabled: [vfd not running, drive not running, vfd stopped, vfd in local, drive in hand, vfd no run
          command, drive not enabled, vfd ready not running, vfd in stop, drive idle, vfd shows ready]
      no_display: [vfd dead, drive dead, vfd blank, no display on vfd, drive no display, vfd no power, drive
          dark]
  - id: ahu.vfd_fault
    name: VFD fault type
    ask: What kind of fault is the VFD showing?
    how: Read the fault description, not just the code — every maker names them differently. Note what it was
      doing when it tripped (starting, slowing, running steady, hot afternoon).
    caution: Don't keep resetting a drive that tripped on overcurrent or a ground fault — find the cause first.
      Opening the drive means lockout, the maker's discharge wait and a zero-volt check on the DC bus.
    systems: [ahu]
    requires: {vfd: ['yes']}
    ask_if: {ahu.vfd_status: fault}
    states:
      none: No fault shown
      overcurrent: Overcurrent / motor overload
      line: Undervoltage, phase loss or DC-bus overvoltage
      ground_fault: Ground fault
      overtemp: Drive overtemperature
    normal: none
    base: {none: 0.9, overcurrent: 0.04, line: 0.03, ground_fault: 0.01, overtemp: 0.02}
    cost: 1
    phrases:
      overcurrent: [overcurrent, over current, oc fault, motor overload fault, overload fault on vfd, current
          limit, overcurrent trip, oc trip, torque limit]
      line: [undervoltage, under voltage, uv fault, dc bus low, bus undervoltage, phase loss, input phase loss,
          overvoltage, over voltage, ov fault, dc bus overvoltage, bus overvoltage, overvoltage on decel,
          regen fault, power loss fault]
      ground_fault: [ground fault, gf fault, earth fault, ground fault trip, motor grounded fault]
      overtemp: [overtemp, over temp, drive overtemperature, heatsink overtemp, oh fault, drive too hot, drive
          overheating, inverter overheat]
  - id: ahu.vfd_speed
    name: VFD speed vs command
    ask: Does the VFD's output frequency match what the controller is asking for?
    how: Compare the drive's Hz readout with the speed reference the drive is actually receiving — read it on the
      keypad. A BAS percent does not always map 0–100 % onto 0–60 Hz, because most drives scale the reference
      between a minimum and a maximum frequency.
    caution: Read the keypad with the drive door closed. Opening the drive means lockout, the maker's discharge
      wait and a zero-volt check on the DC bus.
    systems: [ahu]
    requires: {vfd: ['yes']}
    states:
      matches: Matches the command
      low: Running below the command (by more than about 5 Hz)
      fixed: Ignores the command — sits at one speed
    normal: matches
    cost: 1
    phrases:
      low: [vfd running slow, drive running slow, vfd below command, low frequency, vfd stuck at low speed, vfd
          wont ramp up, drive won't speed up, max frequency, speed limited, fan slow on vfd]
      fixed: [vfd ignores command, vfd in hand, drive in local, vfd stuck at one speed, speed reference lost,
          vfd not following bas, drive fixed speed, no speed reference]
  - id: ahu.rotation
    name: Fan rotation
    ask: Is the wheel turning the right way (arrow on the housing)?
    how: With every door shut and latched and the guards on, watch the wheel through the inlet screen or an
      inspection window. Make sure nobody is in the unit, bump the starter (or jog the drive at low speed) once,
      and compare the direction with the arrow cast into the housing. A centrifugal wheel running backward still
      blows air — just much less of it.
    caution: Never reach in or open a door to check rotation. Doors latched, guards on, and nobody inside the
      unit before you bump the starter or jog the drive.
    systems: [ahu]
    states:
      correct: Correct rotation
      backward: Running backward
    normal: correct
    cost: 1
    phrases:
      backward: [fan backwards, fan running backwards, wrong rotation, reverse rotation, rotation reversed,
          spinning backwards, turning the wrong way, phases swapped, backwards after motor change]
  - id: ahu.belt
    name: Belt
    ask: What condition is the belt in?
    how: Lock out. Press the belt midway between the sheaves — about 1/64 in. of deflection per inch of span is
      right. Look for glazing (shiny sides), cracks, frayed cords, and dust under the drive.
    caution: Stop the fan and lock out before opening the belt guard — a fan can start on a schedule.
    systems: [ahu]
    requires: {fan_drive: [belt]}
    states:
      ok: Tensioned, in good shape
      loose: Loose, glazed or stretched — slipping
      worn: Cracked, frayed, or worn down into the groove
      broken: Broken or off the sheaves
    normal: ok
    cost: 2
    phrases:
      loose: [belt slipping, slipping belt, loose belt, belt loose, glazed belt, belt squeal, belt squealing,
          belt stretched, belt dust, rubber dust, belt chirping, belt smell, burning rubber]
      worn: [worn belt, belt worn, cracked belt, frayed belt, belt bottomed out, old belt, belt shot]
      broken: [broken belt, belt broke, belt off, threw the belt, belt snapped, belt missing, belt gone, belt
          came off]
  - id: ahu.sheave
    name: Sheaves and alignment
    ask: Are the sheaves tight, aligned, and the right size / pitch setting?
    how: Lock out first. Straightedge across both sheave faces for alignment. Try to rock each sheave on its
      shaft (key and set screws). On a variable-pitch motor sheave, count the turns open and compare with the
      record or the balancing report.
    caution: Lock out before touching a sheave or opening the belt guard. Take RPM with a photo-tach on reflective
      tape fitted while locked out, never by reaching at a running shaft.
    systems: [ahu]
    requires: {fan_drive: [belt]}
    states:
      ok: Tight, aligned, as set
      misaligned: Misaligned, or loose on its shaft
      wrong: Pitch or size changed — fan speed no longer what the design calls for
    normal: ok
    cost: 2
    phrases:
      misaligned: [sheave loose, loose sheave, pulley loose, sheave misaligned, pulleys misaligned, pulley
          wobble, sheave wobbling, key sheared, set screw loose, pulley walked out]
      wrong: [wrong sheave, wrong pulley, sheave changed, pitch changed, variable pitch opened, fan rpm wrong,
          fan speed wrong, pulley too small, pulley too big, drive ratio wrong]
  - id: ahu.motor_amps
    name: Fan motor amps vs FLA
    ask: What does the fan motor draw compared with its nameplate FLA, allowing for the speed it is running at?
    how: Clamp the highest leg with the fan steady. Compare at full speed with the boxes open, or enter the
      drive's Hz — a fan the controller has slowed is supposed to read low (on a drive the draw falls roughly
      with the square of the speed). A motor that runs light with the wheel still points to the belt or the
      coupling.
    caution: Live circuit — qualified person only, with a properly rated clamp and PPE. Don't open the panel or
      the drive to get at the leads if you can read them another way.
    systems: [ahu]
    ask_if: {ahu.fan: [running, motor_only, trips]}
    states:
      low: Low — under half of what this speed should draw (under 50 % of FLA at full speed)
      normal: Normal
      high: High — over FLA
    cost: 2
    needs: clamp
    phrases:
      high: [motor overamping, high amps on fan motor, fan motor amps high, drawing over fla, motor hot, motor
          running hot, high current]
      low: [fan motor amps low, low amps, motor amps low, drawing nothing, light load]
  - id: ahu.bearings
    name: Bearings
    ask: How are the fan and motor bearings — spin, noise, heat?
    how: Running (guards on, from outside) — listen on the stationary housing with a mechanic's stethoscope and
      read each housing with an IR thermometer. Compare with the bearing at the other end of the machine, and
      suspect one that runs much hotter than its twin, is over the maker's limit, or keeps climbing between
      visits. Then stop, lock out, and spin the wheel by hand — it should coast smoothly and silently.
    caution: Never put a hand on the bearing or shaft of a running machine. Read it with an IR thermometer from
      outside the guards, and lock out before you spin anything by hand.
    systems: [ahu]
    states:
      ok: Smooth, quiet, cool
      rough: Rough, growling or hot
      seized: Seized — won't turn by hand
    normal: ok
    cost: 2
    phrases:
      rough: [bad bearing, bearing noise, bearing growl, bearing hot, bearings shot, bearing squeal, bearing
          rumble, dry bearing, bearing going, grinding noise, grinding]
      seized: [bearing seized, seized bearing, fan seized, wheel wont turn, wheel won't turn, locked up, frozen
          bearing, shaft locked]
  - id: ahu.noise
    name: Noise or vibration
    ask: What does it sound or feel like?
    systems: [ahu]
    complaint: true
    chip: state
    states:
      normal: No unusual noise or vibration
      squeal: Squeal or chirp, worst at start
      rumble: Growl, rumble or grinding
      vibration: Shaking — vibration you can feel in the housing or duct
      rattle: Rattle, knock or clatter
    cost: 1
    phrases:
      squeal: [squeal, squealing, squeaking, chirp, screeching at start, belt squeal, squeals on start]
      rumble: [rumble, growl, growling, grinding, roar, bearing noise, rumbling, grinding sound]
      vibration: [vibration, vibrating, shaking, shakes, out of balance, wobble, unit vibrates, duct shaking,
          vibrating fan, excessive vibration]
      rattle: [rattle, rattling, knocking, clatter, banging, clanking, something loose, loose panel, knock]
  - id: ahu.wheel
    name: Fan wheel
    ask: What does the fan wheel look like — clean, loaded with dirt, or damaged?
    how: Stop the fan, lock out and tag it, let the wheel stop, then open the fan section. Look at the blades for
      caked dirt (it comes off in flakes), cracks, bent blades, and a wheel that has walked on its shaft or lost
      a balance weight.
    caution: Block the wheel before reaching into the housing — a wheel can turn from airflow or stack effect
      even with the motor locked out.
    systems: [ahu]
    states:
      clean: Clean and sound
      dirty: Blades caked with dirt
      damaged: Damaged, bent, cracked, or loose on the shaft
    normal: clean
    cost: 3
    phrases:
      dirty: [dirty wheel, dirty blower wheel, wheel caked, dirt on blades, wheel loaded, blower wheel dirty,
          fan wheel dirty, caked blades]
      damaged: [wheel damaged, bent blade, cracked wheel, wheel loose on shaft, wheel slipped, blade broken,
          wheel walked, balance weight missing, wheel rubbing, wheel hitting housing, wheel spun on shaft, hub
          slipped, set screws backed out, key sheared on wheel, taper lock slipped]
  - id: ahu.motor
    name: Fan motor test
    ask: What do the motor windings read (each lead to lead, each to ground; thermal protector)?
    how: Lock out and disconnect the leads. Three-phase windings should read equal and low lead-to-lead; any lead
      to ground should be megohms. A single-phase motor whose protector has opened reads open until it cools.
      On a VFD, lock out, wait out the bus-discharge time and verify zero, then disconnect the motor leads at
      the drive's output terminals (T1/T2/T3) before any megger test — never megger through the drive.
    caution: Verify dead at the motor leads before you touch them — a drive output can be live with the keypad
      showing stopped. Megger the motor and cable only with the leads off the drive.
    systems: [ahu]
    ask_if: {ahu.fan: ['off', trips]}
    states:
      ok: Windings balanced, open to ground
      open: A winding open
      grounded: Reads to ground
      overheated: Hot — thermal protector open, reads normal after it cools
    normal: ok
    cost: 3
    needs: meter
    phrases:
      open: [open winding, motor open, winding open, motor reads open, burnt winding]
      grounded: [motor grounded, grounded motor, motor shorted to ground, megger fail, motor megs bad, winding
          grounded, motor shorted]
      overheated: [motor hot, motor overheated, thermal protector open, motor too hot to touch, motor cycling on
          thermal, motor smells hot]
  - id: ahu.phase
    name: Three-phase supply
    ask: Are all three phases present and balanced at the motor or drive terminals?
    how: Meter each pair (L1–L2, L2–L3, L1–L3) with the unit trying to run. One pair far below the others, or a
      motor that growls and won't come up to speed, means a lost leg.
    caution: Live voltage — qualified person only, with a properly rated meter and PPE, and the panel door closed
      where possible. At a drive's terminals, wait out the bus-discharge time before opening anything.
    systems: [ahu]
    ask_if: {gen.power: present}
    states:
      ok: All three present and within a few percent
      phase_loss: One leg missing or far off
    normal: ok
    cost: 2
    needs: meter
    phrases:
      phase_loss: [single phasing, single phase, lost a leg, lost a phase, phase loss, one leg dead, blown fuse
          one leg, missing phase, unbalanced phases, phase imbalance, voltage imbalance]

  # ---------------- safeties ----------------
  - id: ahu.safety
    name: Safeties in the fan start circuit
    ask: Is a safety or interlock in the fan start circuit open (other than the freezestat)?
    how: Follow the start circuit through each device and meter across it — the open one shows voltage across its
      terminals. Typical devices are the duct smoke detector, high-static and low-static switches, the
      outdoor/isolation damper end switch, and a dirty-filter or door switch (the firestat and the freezestat sit
      in the same circuit, but the freezestat has its own check).
    caution: Live voltage — qualified person only, with a properly rated meter and PPE, and the door closed where
      possible; otherwise lock out and use continuity. Never jumper a device in the start circuit to get the fan
      running.
    systems: [ahu]
    ask_if: {ahu.fan: ['off']}
    states:
      closed: All closed
      smoke: Duct smoke detector tripped
      static: High- or low-static switch tripped
      damper: Damper end switch not made
      other: Another interlock open (filter, door, remote stop, fire alarm relay)
    normal: closed
    cost: 2
    needs: meter
    phrases:
      smoke: [smoke detector tripped, duct detector tripped, duct smoke detector, smoke alarm shut down fan,
          fire alarm shutdown, smoke detector reset, fire alarm tripped the fan, duct detector]
      static: [high static switch, high static trip, static switch tripped, low static switch, duct static
          safety, high pressure switch on duct, static pressure switch tripped, high limit static]
      damper: [damper end switch, end switch not made, damper proof, damper not proving, isolation damper
          interlock, end switch open, damper interlock]
      other: [interlock open, safety open, remote stop, door switch, filter switch tripped, fire relay, safety
          circuit open, something in the safety circuit]
  - id: ahu.freezestat
    name: Freezestat / low limit
    ask: Has the freezestat (low-temperature limit) tripped?
    how: Most are manual reset — a button on the stat. Note whether the reset held, or it trips again within
      minutes. After a freeze trip, inspect the coil for bulged bends and split tubes before restoring flow or
      restarting the pump; if any are found, isolate the coil and follow the frozen-coil cause. A stat that won't
      reset has an element still below setpoint — the coil is cold. Don't hold the button or jumper it.
    caution: A freezestat trip is the unit protecting its coil. Never jumper, tape or hold the stat to keep the
      fan running; reset it only once the coil is warm and you know why it tripped.
    systems: [ahu]
    complaint: true
    chip: state
    states:
      ok: Freezestat not tripped
      tripped: Found tripped — reset it and it stayed reset
      retrips: Trips again after reset, or won't reset (element still cold)
    normal: ok
    base: {ok: 0.86, tripped: 0.1, retrips: 0.04}
    cost: 1
    phrases:
      tripped: [freezestat tripped, freeze stat tripped, freezestat, freeze stat, low limit tripped, low temp
          limit, frz stat, freeze protection tripped, low limit, freezestat alarm, freeze alarm, low
          temperature alarm, tripped on freeze, freeze trip]
      retrips: [freezestat keeps tripping, freeze stat keeps tripping, keeps tripping on freeze, trips again
          after reset, retrips freezestat, nuisance freezestat, freezestat trips every morning, low limit keeps
          tripping, freezestat wont reset, freeze stat wont reset, cant reset freezestat, low limit wont reset,
          stat wont reset]
  - id: ahu.fz_setting
    name: Freezestat setpoint and element
    ask: Check the freezestat itself — setpoint, element routing and condition?
    how: Compare its setpoint (usually 35–38 °F — the drawing's figure rules) with the coldest spot you can
      measure where the element runs. Follow the capillary — one long element zig-zagged across the leaving-air
      face of the first water (preheat) coil, about 1 ft of element per ft² of face (follow the maker's sheet),
      without touching the casing or hanging in the outdoor-air stream. It trips on its coldest section, not on
      an average. A stat in the mixed-air plenum ahead of a preheat coil sits under setpoint every cold day by
      design and will trip on all of them, so move it. Check the element for kinks and continuity.
    caution: Don't lower the setpoint, add a delay or jumper the stat to stop a trip — that hides a real cold
      spot and leaves the coil unprotected.
    systems: [ahu]
    ask_if: {ahu.freezestat: [tripped, retrips]}
    states:
      ok: Setpoint reasonable, element intact and routed across the leaving face of the coil
      set_high: Set above its design value, or the element sits ahead of the preheat coil, on cold metal or in
        the outdoor stream
      element_bad: Element kinked, broken, lost its charge, or too short — a bulb or short capillary where a long
        capillary covering the whole face belongs
    normal: ok
    cost: 2
    phrases:
      set_high: [freezestat set too high, freezestat setpoint, element on cold metal, element touching duct,
          element in outside air, freezestat set wrong, low limit set high, freezestat in mixed air, stat ahead
          of preheat coil, freezestat in the wrong place]
      element_bad: [bad freezestat, freezestat bad, freezestat element broken, kinked element, freezestat lost
          charge, failed freezestat, no averaging element, wrong freezestat, short element, bulb type
          freezestat, element too short]

  # ---------------- air path ----------------
  - id: ahu.filter
    name: Filters
    ask: What do the filters look like?
    caution: Stop the fan and lock out before opening the filter section — a running fan pins the door shut or
      slams it, and pulls at loose clothing.
    systems: [ahu]
    states:
      ok: Clean enough, seated, dry
      loaded: Loaded with dirt — pressure drop at or past the filters' final rating
