  - id: ahu.oa_frac
    name: Outdoor-air fraction vs expected
    ask: What outdoor-air fraction is the unit actually taking compared with what it should be taking?
    how: Fraction = (mixed − return) ÷ (outdoor − return), using return and outdoor temperatures at least 10 °F
      apart (the wider the spread, the better the reading). Compare with the design minimum fraction when the
      damper is at minimum, about 100 % when it is commanded full open, and about 0 % when it is closed. A
      part-open blade position is not an air fraction.
    caution: Probe from outside through the test ports. Don't open a mixing-box door with the fan running.
    systems: [ahu]
    requires: {oa_type: [mixed]}
    states:
      low: Much less outdoor air than expected (short by more than about 10–30 points; the allowance grows as the
        return–outdoor spread shrinks)
