  - id: ahu.mat_range
    name: Mixed air vs return and outdoor
    ask: Does the mixed-air temperature sit between the return and outdoor temperatures?
    how: Mixed air can only be a blend of return and outdoor air, so it must land between them. Traverse the
      mixed-air plenum with a long probe through the test ports — a single spot can be in a cold or warm
      stream.
    caution: Probe from outside through the test ports. Don't open a mixing-box door with the fan running.
    systems: [ahu]
