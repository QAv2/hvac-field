  - id: ahu.econ_mode
    name: Economizer mode vs outdoor conditions
    ask: Is the economizer in the right mode for the outdoor conditions?
    how: Outdoor air below (supply setpoint − fan heat) should mean dampers open for free cooling with no
      mechanical cooling. Between that and the changeover (outdoor cooler than return, or under the dry-bulb or
      enthalpy high limit) the dampers stay at 100 % and mechanical cooling trims — that is correct, not a
      fault. Above the changeover the unit should be at minimum outdoor air with mechanical cooling. The faults
      are dampers past minimum with outdoor air above the changeover; minimum outdoor air with mechanical
      cooling while outdoor air is below it; and dampers past minimum while heating (unless CO₂ demand
      ventilation is calling for it).
    systems: [ahu]
    requires: {economizer: ['yes']}
    states:
      ok: Right mode for the conditions
      econ_when_hot: Dampers open for free cooling while outdoor air is above the changeover
      mech_when_cool: Mechanical cooling at minimum outdoor air while outdoor air is below the changeover
      heating_with_econ: Heating while the dampers are open past minimum (and no demand-ventilation call)
    normal: ok
    cost: 2
    phrases:
