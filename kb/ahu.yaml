  - id: ahu.static
    name: Fan static vs design
    ask: What is the fan's own static pressure rise (discharge minus inlet, across the fan — not the duct static the
      BAS shows) compared with design?
    how: Manometer across the fan — inlet side (after filters and coils on a draw-through) to discharge — through
      the test ports or fittings. High static with low air means a restriction somewhere; low static with low
      air means the fan isn't producing. Compare with design at full speed with the boxes open, or enter the
      drive's Hz — a fan the controller has slowed is supposed to read low (about design times the square of the
      speed ratio). On a VAV system holding a duct-static setpoint it falls less than that, so treat the
      corrected figure as a floor. A moderate upstream restriction (filters, coil, intake) moves the fan's
      static rise by only 5–20 % — find it from the ΔP across that item. Static 25 % or more over design with
      low airflow means a big restriction or a closed damper. A fan handling −40 °F air should read about 1.26
      times its design static.
    caution: Use the test ports or fittings. Never open a door on a running fan to place a manometer hose.
    systems: [ahu]
    states:
      low: Low — under 70 % of design for this speed, fan not producing
      normal: Normal — 70 to 125 % of design for this speed
      high: High — over 125 % of design for this speed, working against a restriction
    cost: 3
    needs: manometer
    phrases:
      high: [high static, static high, high static pressure, high duct static, restricted, too much static,
          duct static high]
