module: vc-core
title: Vapor-compression core — the refrigerant circuit, compressor, fans and A/C basics
notes: |
  Signatures follow the NIST rule charts (SP 1087 Table 5.2 for TXV units, Table 5.1(a) for fixed-orifice
  units) where they cover a fault, and general practice elsewhere. With a TXV, mild faults hide: the valve
  holds superheat until it runs out of stroke (NIST "zone A"), so TXV signs spread between normal and the
  fixed-orifice direction. Superheat above ~16 °F at the evaporator means the TXV is wide open (zone B).

features:
  # ---------------- what's running ----------------
  - id: vc.comp
    name: Compressor
    ask: Is the compressor running?
    how: Listen and feel at the condensing unit — a running compressor hums steadily and the discharge line gets
      hot within a minute or two.
    systems: [vc]
    states:
      running: Running
      off: Not running (silent)
      hums: Hums, clicks or trips — tries but won't start
    normal: running
    base: {running: 0.85, off: 0.1, hums: 0.05}
    cost: 1
    phrases:
      off: [compressor not running, compressor off, compressor wont start, compressor won't start, compressor dead,
        no compressor, compressor not coming on]
      hums: [compressor humming, compressor hums, compressor buzzing, compressor clicking, compressor trips,
        tries to start, wont start hums, locked rotor, hard start, compressor overload trips]
      running: [compressor running, compressor on]
  - id: vc.cond_fan
    name: Condenser fan
    ask: Is the condenser fan running at full speed?
    ask_for: {vc.hp: 'Is the outdoor fan running at full speed?', vc.walkin: 'Is the condenser fan doing what its control calls for? (Running when head is above cut-in; off or slow in cold air with head at cut-out is normal for fan cycling or a VFD.)', vc.reachin: 'Is the condenser fan doing what its control calls for? (Running when head is above cut-in; off or slow in cold air with head at cut-out is normal for fan cycling or a VFD.)', vc.ice: 'Is the condenser fan doing what its control calls for? (Running when head is above cut-in; off or slow in cold air with head at cut-out is normal for fan cycling or a VFD.)'}
    systems: [vc]
    requires: {condenser: air}
    states:
      running: Running normally
      off: Not running
      slow: Running slow, wobbling or backwards
    normal: running
    cost: 1
    phrases:
      off: [condenser fan not running, outdoor fan not running, condenser fan off, outside fan not spinning,
        fan not spinning, condenser fan dead, condenser fan stopped]
      slow: [condenser fan slow, fan slow, fan running slow, fan wobbling, fan backwards, fan hums]
      running: [condenser fan running, outdoor fan running, condenser fan on, condenser fan spinning]
  - id: vc.evap_fan
    name: Evaporator fan / blower
    ask: Are the evaporator fans (the indoor blower on A/C) running and moving full air?
    ask_for: {vc.hp: 'Is the indoor blower running and moving full air?'}
    systems: [vc]
    states:
      running: Running, good airflow
      weak: Running but airflow weak
      off: Not running
    normal: running
    cost: 1
    phrases:
      off: [evaporator fan not running, evap fan not running, evap fan off, blower not running, blower off,
        indoor fan not running, no air from vents, fan motor dead, evaporator fan dead]
      weak: [weak airflow, low airflow, poor airflow, weak air, little air from vents, blower slow, fan slow]
      running: [evaporator fan running, evap fans running, evaporator fans running, blower running, fans running,
        good airflow, air coming out]
  - id: vc.contactor
    name: Contactor
    ask: What is the contactor doing (with the unit calling)?
    how: Look at the plunger, then meter line voltage in and out across each pole.
    systems: [vc]
    ask_if: {vc.comp: [off, hums, running]}
    states:
      ok: Pulled in, full voltage through
      not_pulling: Not pulled in
      burnt: Pulled in but contacts burnt — voltage drop across them
      welded: Stuck closed — stays in with no call
    normal: ok
    cost: 2
    needs: meter
    phrases:
      not_pulling: [contactor not pulling in, contactor not engaging, contactor open, contactor wont pull in]
      burnt: [contactor burnt, contacts pitted, burnt contacts, pitted contacts, contactor burned]
      welded: [contactor stuck, contactor welded, contactor stuck closed, runs with thermostat off]
  - id: vc.coil_24v
    name: 24 V at the contactor coil
    ask: Is there 24 V across the contactor coil terminals?
    systems: [vc]
    ask_if: {vc.contactor: not_pulling}
    states:
      'yes': 24 V present at the coil
      'no': No 24 V at the coil
    normal: 'yes'
    cost: 2
    needs: meter
  - id: vc.cap
    name: Run capacitor
    ask: What does the run capacitor test at (µF vs rating)?
    how: Power off, discharge it through a resistor (not a screwdriver), then test each section (HERM–C, FAN–C)
      with a µF meter. Bulged tops or oil leaking mean replace.
    systems: [vc]
    ask_if: {vc.comp: [hums, off, running]}
    states:
      ok: Within rating (−7 % to +10 % of the µF on the label)
      bad: Low, open, or bulged
    normal: ok
    cost: 2
    needs: meter
    phrases:
      bad: [bad capacitor, bad cap, weak capacitor, capacitor bulged, swollen capacitor, capacitor out of range,
        capacitor failed, dead cap]
  - id: vc.start_parts
    name: Start capacitor, relay or PTC
    ask: Do the start capacitor, potential relay or PTC test good?
    how: Power off, then discharge the capacitors through a resistor. Start cap in range and not bulged; relay coil
      continuity and contacts not pitted or stuck; PTC cold resistance a few ohms (open or very high when cold is bad).
    systems: [vc]
    ask_if: {vc.comp: [hums, off]}
    states:
      ok: Test good
      bad: Open, burnt, low µF, relay contacts pitted or stuck
    normal: ok
    cost: 2
    needs: meter
    phrases:
      bad: [bad start capacitor, bad start relay, potential relay bad, ptc bad, hard start kit failed]
  - id: vc.windings
    name: Compressor windings
    ask: What do the compressor windings read (C–R, C–S, R–S, each to ground)?
    how: Power off and locked out. R–S should equal C–R + C–S. Any terminal to ground should read open
      (megohms). If C–R and C–S read open but R–S reads normal, the internal overload is open — let it cool.
    caution: Never megger a compressor that is under vacuum.
    systems: [vc]
    ask_if: {vc.comp: [off, hums]}
    states:
      ok: Normal readings
      overload_open: C–R and C–S open, R–S normal (hot — internal overload open)
      open: A winding open
      shorted: Shorted (too low)
      grounded: Reads to ground
    normal: ok
    cost: 3
    needs: meter
    phrases:
      grounded: [compressor grounded, grounded compressor, compressor shorted to ground, megger fail]
      open: [open winding, compressor winding open]
      overload_open: [internal overload open, compressor overload open, compressor hot and off]
  - id: vc.phase
    name: Three-phase supply at the compressor
    ask: Are all three legs present and balanced at the compressor contactor?
    how: Open the panel with the power off. Then, with the call on and proper PPE, meter L1–L2, L2–L3 and L1–L3 on the
      line side of the contactor and again on the load side. Within 2 % of each other is good; one pair far low, or a
      leg that drops across a pole, is a lost leg. With the compressor running, clamp each leg — more than 10 % apart
      is bad.
    caution: Live metering — rated PPE and meter, one hand, and treat every terminal as live until proven dead.
    systems: [vc]
    ask_if: {gen.power: present}
    states:
      ok: All three present and balanced
      phase_loss: One leg missing or far off
      unbalanced: Present but unbalanced (over 2 % volts or 10 % amps)
    normal: ok
    cost: 2
    needs: meter
    phrases:
      phase_loss: [single phasing, lost a leg, lost a phase, phase loss, one leg dead, blown fuse one leg, missing phase]
      unbalanced: [unbalanced phases, phase imbalance, voltage imbalance, high amps one leg]
  - id: vc.rotation
    name: Phase sequence at the compressor
    ask: Does a phase-sequence tester (or the unit's phase monitor) say the rotation is correct?
    how: Rotation meter on the line terminals, power on. A scroll compressor with two legs swapped runs backwards — loud,
      pumps nothing, and trips its protector after a few minutes.
    caution: Live metering — rated PPE and meter, one hand, and treat every terminal as live until proven dead.
    systems: [vc]
    states:
      correct: Correct sequence
      reversed: Reversed
    normal: correct
    cost: 3
    needs: meter
    phrases:
      reversed: [phase reversed, wrong rotation, compressor running backwards, scroll backwards, phases swapped, phase monitor fault]
  - id: vc.comp_hot
    name: Compressor overheated
    ask: Is the compressor cycling off on its internal overload, or hotter than the same model normally runs
      (use a thermometer, not your hand)?
    systems: [vc]
    chip: state
    states:
      'yes': Compressor overheated / cycling on overload
      'no': Compressor temperature normal
    normal: 'no'
    cost: 1
    phrases:
      'yes': [compressor hot, compressor overheating, compressor very hot, compressor cycling on overload,
        overload tripping, thermal overload, compressor shuts off hot]
  - id: vc.comp_sweat
    name: Compressor sweating or frosting (floodback)
    ask: Is the crankcase frosted, or sweating all the way up the shell (not just the lower shell on a humid day)?
    systems: [vc]
    chip: state
    states:
      'yes': Frost on the crankcase / sweating up the whole shell — liquid floodback
      'no': No frost; shell dry or only a damp lower shell
    normal: 'no'
    cost: 1
    phrases:
      'yes': [compressor sweating, compressor frosting, frost on compressor, crankcase frosted, floodback,
        flood back, liquid floodback, sweating compressor, frost back to compressor]
  - id: vc.comp_noise
    name: Compressor noise
    ask: Does the compressor knock, rattle or bang?
    systems: [vc]
    states:
      normal: Normal hum
      knock: Knocking, rattling or banging
    cost: 1
    phrases:
      knock: [compressor knocking, compressor rattling, compressor banging, compressor noisy, loud compressor,
        slugging, compressor clanking]

  # ---------------- looking at it ----------------
  - id: vc.evap_frost
    name: Evaporator ice / frost
    ask: How much ice or frost is on the evaporator coil?
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    states:
      none: None, or the normal light frost between defrosts (on an A/C coil any frost is abnormal)
      partial: Frost on part of the coil only
      heavy: Iced up / blocked with ice
    normal: none
    base: {none: 0.84, partial: 0.1, heavy: 0.06}
    cost: 1
    phrases:
      heavy: [iced coil, coil iced, iced up, frozen coil, coil frozen, evaporator iced, evaporator frozen,
        ice on coil, ice buildup, block of ice, frozen up, freezing up, ice on evaporator, iced over]
      partial: [partial frost, frost on part of coil, frost at the inlet, frost on first few rows, half frosted,
        frost on suction line, frosting]
  - id: vc.cond_dirty
    name: Condenser coil
    ask: Is the condenser coil dirty, matted, or blocked?
    ask_for: {vc.hp: 'Is the outdoor coil dirty, matted or blocked?'}
    systems: [vc]
    requires: {condenser: air}
    states:
      'no': Clean, open fins
      'yes': Dirty, matted or blocked
    normal: 'no'
    cost: 1
    phrases:
      'yes': [dirty condenser, condenser dirty, clogged condenser, plugged condenser, condenser coil dirty, lint,
        cottonwood, matted fins, dirty coil outside, grease on condenser]
  - id: vc.cond_airpath
    name: Air path to the condenser
    ask: Is the condenser's air path clear (no walls, snow, stacked units or hot-air recirculation)?
    ask_for: {vc.hp: "Is the outdoor coil's air path clear (snow, drifts, walls, a cover)?"}
    systems: [vc]
    requires: {condenser: air}
    states:
      clear: Clear
      blocked: Blocked or recirculating
    normal: clear
    cost: 1
    phrases:
      blocked: [condenser blocked, snow drift, snow around condenser, drifted in, buried in snow, recirculating,
        hot air recirculation, unit boxed in, too close to wall, blocked airflow]
  - id: vc.evap_dirty
    name: Evaporator coil
    ask: Is the evaporator coil dirty or matted on the air-entering face?
    ask_for: {vc.hp: 'Is the indoor coil dirty or matted?'}
    systems: [vc]
    states:
      'no': Clean
      'yes': Dirty or matted
    normal: 'no'
    cost: 2
    phrases:
      'yes': [dirty evaporator, evaporator dirty, dirty evap coil, matted evaporator, plugged evaporator coil]
  - id: vc.filter
    name: Air filter
    ask: Is the air filter dirty or collapsed?
    systems: [vc.ac, vc.hp]
    states:
      clean: Clean
      dirty: Dirty, clogged or collapsed
    normal: clean
    cost: 1
    phrases:
      dirty: [dirty filter, clogged filter, filter dirty, plugged filter, filter collapsed, no filter changes]
  - id: vc.ducts
    name: Ducts and registers
    ask: Are supply registers and dampers open and the ducts intact?
    systems: [vc.ac, vc.hp]
    states:
      ok: Open and intact
      restricted: Closed registers or dampers, crushed or undersized duct
      leaking: Disconnected or leaking duct (return pulling in attic or outdoor air)
    normal: ok
    cost: 2
    phrases:
      restricted: [closed registers, closed vents, dampers closed, crushed duct, kinked flex duct, undersized return]
      leaking: [duct disconnected, disconnected duct, leaky duct, return leak, duct leak, attic air]
  - id: vc.drain
    name: Condensate drain
    ask: Is the condensate drain open, or is the pan full / float switch tripped?
    systems: [vc.ac, vc.hp]
    states:
      clear: Draining
      clogged: Clogged — pan full or float switch tripped
    normal: clear
    cost: 1
    phrases:
      clogged: [drain clogged, clogged drain, drain line clogged, condensate backed up, pan full, drain pan full,
        float switch tripped, safety switch tripped, water in pan, algae in drain]
  - id: vc.sight_glass
    name: Sight glass
    ask: What does the liquid-line sight glass show with the system running steady?
    how: Give it 10–15 minutes of steady running. A few bubbles right after start-up or during head-pressure
      control swings are normal.
    systems: [vc]
    requires: {receiver: 'yes'}   # the receiver question asks about the tank and its sight glass together
    states:
      clear: Full and clear
      bubbles: Bubbles or foam
    normal: clear
    cost: 1
    phrases:
      bubbles: [bubbles in sight glass, bubbling sight glass, foaming sight glass, sight glass bubbles,
        flashing, foamy]
      clear: [sight glass clear, clear sight glass, full sight glass]
  - id: vc.moisture_ind
    name: Moisture indicator
    ask: What color is the moisture indicator in the sight glass?
    systems: [vc]
    states:
      dry: Dry color
      wet: Wet / caution color
    normal: dry
    cost: 1
    phrases:
      wet: [moisture indicator wet, sight glass yellow, wet indicator, moisture in system, caution color]
  - id: vc.oil
    name: Oil spots
    ask: Is there oil residue at a joint, valve, Schrader, or on the coil?
    systems: [vc]
    states:
      'no': None found
      'yes': Oil spots or residue
    normal: 'no'
    cost: 2
    phrases:
      'yes': [oil spot, oil residue, oily joint, oil on coil, oil stain, oil leak]
  - id: vc.leak_found
    name: Refrigerant leak
    ask: Did a leak search (electronic detector, bubbles or UV dye) find a leak?
    systems: [vc]
    states:
      'no': No leak found
      'yes': Leak found
    normal: 'no'
    cost: 4
    phrases:
      'yes': [found leak, leak found, refrigerant leak, freon leak, leaking refrigerant, bubbles at joint,
        detector alarm, dye shows leak]
  - id: vc.liquid_cold_spot
    name: Cold spot on the liquid line
    ask: Is there a cold, sweating or frosted spot on the liquid line (at the drier, a valve or a kink)?
    systems: [vc]
    states:
      'no': No cold spot
      'yes': Cold, sweating or frosted spot
    normal: 'no'
    cost: 1
    phrases:
      'yes': [frost on liquid line, cold drier, frosted drier, sweating drier, frost on filter drier, cold spot on
        liquid line, kinked line, frost at solenoid]
  - id: vc.low_ambient
    situational: true
    name: Cold outdoor air
    ask: Is it running with cold outdoor (condenser) air — below about 55 °F?
    systems: [vc]
    requires: {condenser: air}
    chip: state
    states:
      'no': Condenser air warm enough
      'yes': Running with cold outdoor air
    normal: 'no'
    base: {'no': 0.85, 'yes': 0.15}
    cost: 1
    phrases:
      'yes': [cold outside, cold weather, winter, low ambient, freezing outside, below freezing outside]

  # ---------------- pressures and temperatures (gauges on) ----------------
  - id: vc.evap_sat
    name: Suction pressure (evaporator temp)
    ask: How does the suction pressure / evaporator saturation temperature compare with normal?
    how: Saturation temperature from the suction pressure (dew point for blends), compared with the air entering
      the coil — about 35 °F below return air on A/C, about 10 °F below box air on refrigeration, and on a heat
      pump in heating roughly 3–18 °F below the outdoor air (read suction at a true suction port, not the big
      vapor valve).
    systems: [vc]
    states:
      low: Low
      normal: Normal
      high: High
    cost: 3
    needs: gauges
    phrases:
      low: [low suction, low suction pressure, low back pressure, low low side, suction pressure low, low evap
        temp, low evaporator pressure]
      high: [high suction, high suction pressure, high back pressure, high low side, suction pressure high]
  - id: vc.cond_sat
    name: Head pressure (condensing temp)
    ask: How does the head pressure / condensing temperature compare with normal (an A/C usually condenses
      20–30 °F above the outdoor air, 15–20 °F on a high-efficiency unit)?
    how: Condensing temperature from the high-side pressure, compared with the air entering the condenser — on a
      heat pump in heating that is the indoor coil, normally about 20–40 °F above return air.
    systems: [vc]
    states:
      low: Low
      normal: Normal
      high: High
    cost: 3
    needs: gauges
    phrases:
      low: [low head, low head pressure, low high side, low discharge pressure, head pressure low]
      high: [high head, high head pressure, high high side, high discharge pressure, head pressure high,
        high pressure trip, high pressure switch]
  - id: vc.superheat
    name: Superheat
    ask: What is the superheat compared with its target (a TXV usually holds 8–12 °F at the evaporator outlet and
      more at the compressor end)?
    systems: [vc]
    states:
      low: Low
      normal: Normal
      high: High
    cost: 3
    needs: gauges
    phrases:
      low: [low superheat, low sh, flooding, flooded evaporator, liquid returning, zero superheat]
      high: [high superheat, high sh, starving, starved evaporator, starved coil]
  - id: vc.subcool
    name: Subcooling
    ask: What is the subcooling compared with its target?
    systems: [vc]
    states:
      low: Low
      normal: Normal
      high: High
    cost: 3
    needs: gauges
    phrases:
      low: [low subcool, low subcooling, low sc, no subcooling]
      high: [high subcool, high subcooling, high sc]
  - id: vc.discharge_temp
    name: Discharge line temperature
    ask: How hot is the discharge line 6 in. from the compressor?
    how: Read it 6 in. from the compressor and compare it with the condensing temperature. It runs about 60–90 °F
      above it on R-410A and R-134a, 50–75 °F on R-404A medium-temp, and 85–125 °F on low-temp and R-22 (typical —
      the maker's data wins). Above 250 °F the oil starts to break down whatever the condensing temperature is.
      Within about 25 °F of the condensing temperature means liquid is coming back.
    systems: [vc]
    states:
      low: Low (liquid coming back)
      normal: Normal
      high: High for the condensing temperature (or over 250 °F)
    cost: 3
    needs: gauges
    phrases:
      high: [high discharge temperature, high discharge temp, discharge line very hot, hot discharge line,
        overheating discharge]
      low: [low discharge temperature, cool discharge line]
  - id: vc.comp_amps
    name: Compressor amps
    ask: What does the compressor draw compared with its RLA?
    systems: [vc]
    ask_if: {vc.comp: running}
    states:
      low: Low (under 50 % of RLA, under 35 % on a freezer)
      normal: Normal
      high: High (over RLA)
    cost: 2
    needs: clamp
    phrases:
      high: [high amps, high amp draw, overamping, drawing high amps, amps over rla]
      low: [low amps, low amp draw]
  - id: vc.evap_split
    name: Air temperature drop across the evaporator
    ask: What is the return-minus-supply air temperature split compared with its target?
    systems: [vc.ac]
    states:
      low: Low (too little drop)
      normal: Normal
      high: High (too much drop)
    cost: 2
    phrases:
      low: [low temperature split, low delta t, low split, supply air warm, small temperature drop]
      high: [high temperature split, high delta t, high split, supply air very cold]
  - id: vc.cond_split
    name: Air temperature rise across the condenser
    ask: How much does the air warm up going through the condenser?
    systems: [vc]
    requires: {condenser: air}
    states:
      low: Low
      normal: Normal
      high: High
    cost: 2
  - id: vc.drier_dt
    name: Temperature drop across the filter-drier
    ask: Is there a temperature drop from inlet to outlet of the liquid-line filter-drier?
    systems: [vc]
    states:
      normal: Under 3 °F
      high: 3 °F or more (restricted)
    cost: 2
    needs: thermometer
    phrases:
      high: [restricted drier, plugged drier, temperature drop across drier, drier restriction, clogged drier]
  - id: vc.standing
    name: Standing pressure (system off)
    ask: With the system off and equalized, does the standing pressure match the refrigerant's PT at that
      temperature?
    how: Off at least an hour (overnight is best), with the coil and condenser shaded and at the same temperature
      as the air around them. If the condensing unit and the evaporator are at different temperatures (winter,
      outdoor unit), the pressure follows the colder liquid-holding part — use that temperature and treat the
      result as a hint, or wait for them to equalize.
    systems: [vc]
    states:
      matches: Matches the PT chart
      high: Higher than the PT chart (by more than 4 psi or 4 %, whichever is larger)
      low: Lower than the PT chart (by more than 4 psi or 4 %, whichever is larger)
    normal: matches
    cost: 4
    needs: gauges
    phrases:
      high: [standing pressure high, pressure higher than pt, non condensables, noncondensables, air in system]
  - id: vc.identifier
    name: Refrigerant identifier
    ask: What does a refrigerant identifier (or a careful standing-pressure check) say about the charge?
    systems: [vc]
    states:
      matches: Matches the nameplate refrigerant
      mixed: Wrong or mixed refrigerant
    normal: matches
    base: {matches: 0.97, mixed: 0.03}
    cost: 4
    phrases:
      mixed: [wrong refrigerant, mixed refrigerant, contaminated refrigerant, topped off with wrong gas]
  - id: vc.pumpdown
    name: Compressor pumping test
    ask: Does the compressor pull the suction down and hold it (pump-down / efficiency test)?
    how: Close the liquid valve with the compressor running and watch the suction gauge. A healthy compressor
      reaches about 0 psig in a minute or two on a small system. Stop it there, then watch whether suction climbs
      back — with everything closed, a rise of more than a few psi a minute means leaking valves. The climb-back
      part is not valid on a piston, cap tube or bleed-port TXV — they equalize by themselves; use the pull-down
      only.
    caution: Stop the compressor at about 0 psig. Never run a scroll or hermetic compressor into a vacuum — it
      arcs at the terminals and loses oil.
    systems: [vc]
    states:
      ok: Pulls down and holds
      weak: Can't pull down — or, with the liquid valve closed on a non-bleed TXV, pressures equalize in a minute
        or two
    normal: ok
    cost: 4
    needs: gauges
    phrases:
      weak: [compressor not pumping, weak compressor, compressor wont pump down, bad valves, valves leaking,
        inefficient compressor]
  - id: vc.txv_bulb
    name: TXV bulb test
    ask: Does the TXV respond when you warm or cool its sensing bulb?
    how: Warming the bulb (hand or warm rag) should open the valve — suction pressure rises, superheat falls.
      Cooling it (ice water) should close it down.
    systems: [vc]
    requires: {metering: txv}
    states:
      responds: Responds normally
      no_response: No response (stuck, or the bulb lost its charge)
    normal: responds
    cost: 3
    needs: gauges
    phrases:
      no_response: [txv not responding, txv stuck, expansion valve stuck, lost bulb charge, dead power head]
  - id: vc.bulb_mount
    name: TXV bulb mounting
    ask: Is the TXV bulb tight on a clean section of suction line and insulated?
    systems: [vc]
    requires: {metering: txv}
    states:
      good: Tight and insulated
      poor: Loose, uninsulated or in the wrong place
    normal: good
    cost: 2
    phrases:
      poor: [bulb loose, txv bulb loose, bulb not insulated, bulb uninsulated, bulb fell off, bulb in wrong spot]
  - id: vc.lps_trip
    name: Low-pressure switch
    ask: Is it cycling off on the low-pressure switch?
    ask_for: {vc.walkin: 'Is it cutting out on the low-pressure switch while the box is still calling? (The normal pump-down cut-out at the end of a cycle does not count.)'}
    systems: [vc]
    chip: state
    states:
      'no': Not tripping on low pressure
      'yes': Cycling off on low pressure
    normal: 'no'
    cost: 2
    phrases:
      'yes': [low pressure switch, low pressure cutout, lps tripping, low pressure trip, cuts out on low pressure,
        low pressure lockout]
  - id: vc.hps_trip
    name: High-pressure switch
    ask: Is it tripping the high-pressure switch (or needing a manual reset)?
    systems: [vc]
    chip: state
    states:
      'no': Not tripping on high pressure
      'yes': Tripping on high pressure
    normal: 'no'
    cost: 2
    phrases:
      'yes': [high pressure switch, high pressure cutout, hps tripped, high pressure trip, high pressure lockout,
        manual reset high pressure, tripped high limit]
  - id: vc.static
    name: Total external static pressure
    ask: What is the total external static pressure across the air handler compared with its rating?
    systems: [vc.ac, vc.hp]
    states:
      low: Low
      normal: Normal
      high: High
    cost: 3
    needs: manometer
    phrases:
      high: [high static, high static pressure, restricted ductwork]

inputs:
  - {id: vc.suction_psig, name: Suction pressure, unit: psig, systems: [vc], probe: pressure, hint: Low-side gauge. On a heat
      pump in heating this is NOT the big vapor service valve — that one is discharge in heating}
  - {id: vc.suction_line_f, name: Suction line temp, unit: °F, systems: [vc], probe: pipe, hint: Where superheat is
      read — see the location question}
  - {id: vc.liquid_psig, name: Liquid / high-side pressure, unit: psig, systems: [vc], probe: pressure, hint: "Liquid
      line service valve (or discharge on units without one — discharge pressure adds 1–3 °F of apparent subcooling
      from the condenser's pressure drop)"}
  - {id: vc.liquid_line_f, name: Liquid line temp, unit: °F, systems: [vc], probe: pipe, hint: Next to the liquid
      service valve}
  - {id: vc.discharge_line_f, name: Discharge line temp, unit: °F, systems: [vc], probe: pipe, hint: 6 in. from the
      compressor}
  - {id: vc.ambient_f, name: Air entering condenser, unit: °F, systems: [vc], probe: air, hint: Outdoor or
      condenser inlet air}
  - {id: vc.cond_air_out_f, name: Air leaving condenser, unit: °F, systems: [vc], probe: air}
  - {id: vc.air_in_f, name: Air entering evaporator, unit: °F, systems: [vc], probe: air, hint: Return air (A/C) or
      box air (refrigeration)}
  - {id: vc.air_in_rh, name: Return air humidity, unit: '% RH', systems: [vc.ac], probe: rh}
  - {id: vc.air_in_wb, name: Return air wet bulb, unit: °F, systems: [vc.ac], probe: rh, hint: Leave blank if you
      entered humidity}
  - {id: vc.air_out_f, name: Supply air, unit: °F, systems: [vc.ac], probe: air, hint: Air leaving the evaporator}
  - {id: vc.comp_amps_meas, name: Compressor amps, unit: A, systems: [vc], probe: clamp}
  - {id: vc.comp_rla, name: Compressor RLA (nameplate), unit: A, systems: [vc]}
  - {id: vc.sc_target, name: Subcooling target (nameplate), unit: °F, systems: [vc], default: 10}
  - {id: vc.drier_in_f, name: Drier inlet temp, unit: °F, systems: [vc], probe: pipe}
  - {id: vc.drier_out_f, name: Drier outlet temp, unit: °F, systems: [vc], probe: pipe}
  - {id: vc.cap_meas_uf, name: Capacitor reading, unit: µF, systems: [vc]}
  - {id: vc.cap_rated_uf, name: Capacitor rating, unit: µF, systems: [vc]}
  - {id: vc.standing_psig, name: Standing pressure (off), unit: psig, systems: [vc], probe: pressure}
  - {id: vc.standing_temp_f, name: System temperature (off), unit: °F, systems: [vc], hint: "The colder of the
      condenser and the coil after the unit has been off at least an hour (overnight is best) and shaded. If they
      differ (winter, outdoor unit) the pressure follows the colder liquid-holding part — treat the result as a
      hint."}
  - {id: vc.tesp_inwc, name: Total external static, unit: in. w.c., systems: [vc.ac, vc.hp], probe: manometer}
  - {id: vc.tesp_rated, name: Rated external static, unit: in. w.c., systems: [vc.ac, vc.hp], default: 0.5}

measures:
  # display values the other measures build on
  - id: vc.evap_sat_t
    name: Evaporator saturation (dew)
    unit: °F
    systems: [vc]
    value: tsat_dew(vc.suction_psig)
  - id: vc.cond_sat_t
    name: Condensing saturation (bubble)
    unit: °F
    systems: [vc]
    value: tsat_bubble(vc.liquid_psig)
  - id: vc.cond_mid_t
    name: Condensing temperature (midpoint)
    unit: °F
    hidden: true
    systems: [vc]
    value: tsat_mid(vc.liquid_psig)

  - id: vc.superheat
    name: Superheat
    unit: °F
    systems: [vc]
    let:
      fixed: (ctx.metering ?? 'txv') == 'fixed'
      cap: (ctx.metering ?? 'txv') == 'captube'
      app: ctx.app ?? 'mt'
      unk: "!has(ctx.sh_location) && app != 'ac'"
      atcomp: "(ctx.sh_location ?? (app == 'ac' ? 'comp' : 'evap')) == 'comp'"
      wb: vc.air_in_wb ?? wetbulb(vc.air_in_f, vc.air_in_rh)
      # the fixed-orifice superheat method holds from 55 °F outdoors up (the CEC chart's range); below that there's
      # no target, so only floodback (under 4 °F) gets a verdict
      cold: (vc.ambient_f ?? 95) < 55
    value: vc.suction_line_f - tsat_dew(vc.suction_psig)
    target: 'fixed ? (cold ? null : fo_target_sh(wb, vc.ambient_f) ?? 12) : cap ? (atcomp ? 20 : 10) : app == ''ac'' ? (atcomp ? 12 : 10) : atcomp ? (app == ''lt'' ? 40 : 25) : (app == ''lt'' ? 6 : 8)'
    sets: vc.superheat
    states:
      - [low, 'v < (fixed ? 4 : 0) || v < t - (fixed ? 5 : max(4, 0.45 * t))']
      - [high, 'unk ? v > (app == ''lt'' ? 68 : 43) : v > t + (fixed ? 6 : max(7, 0.7 * t))']
      - [normal, 'true']
  - id: vc.subcool
    name: Subcooling
    unit: °F
    systems: [vc]
    let:
      rcv: (ctx.receiver ?? 'no') == 'yes'
      fo: "(ctx.metering ?? 'txv') == 'fixed' || (ctx.metering ?? 'txv') == 'captube'"
    value: tsat_bubble(vc.liquid_psig) - vc.liquid_line_f
    target: 'rcv ? 5 : vc.sc_target'
    sets: vc.subcool
    states:
      - [low, 'v < (rcv ? -1.5 : t - 4.5)']
      - [high, 'rcv ? (v > 20 && (vc.ambient_f ?? 80) > 65) : v > t + (fo ? 7 : 5.5) + max(0, 0.4 * (65 - (vc.ambient_f ?? 95)))']
      - [normal, 'true']
  - id: vc.evap_td
    name: Evaporator temperature vs air entering
    unit: °F
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    let:
      app: ctx.app ?? 'mt'
      ac: app == 'ac'
    value: vc.evap_sat_t
    target: 'vc.air_in_f - (ac ? 35 : app == ''lt'' ? 10 : 12)'
    sets: vc.evap_sat
    states:
      - [low, 'v < t - (ac ? 8 : 7) || (ac && v < 30)']
      - [high, 'v > t + (ac ? 9 : 7)']
      - [normal, 'true']
  - id: vc.evap_abs
    name: Evaporator temperature (no air reading)
    unit: °F
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    let:
      app: ctx.app ?? 'mt'
    value: vc.evap_sat_t
    target: 'app == ''ac'' ? 40 : app == ''lt'' ? -20 : 22'
    sets: vc.evap_sat
    states:
      - [low, 'v < t - 10']
      - [high, 'v > t + 12']
      - [normal, 'true']
  - id: vc.cond_dev
    name: Condensing temperature vs expected
    unit: °F
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    let:
      ac: (ctx.app ?? 'mt') == 'ac'
      ctoa: '(ctx.ac_eff ?? ''unknown'') == ''high'' ? 15 : (ctx.ac_eff ?? ''unknown'') == ''standard'' ? 25 : 20'
      td: "(ctx.app ?? 'mt') == 'lt' ? 15 : 20"
      floor: '85'
    value: vc.cond_mid_t
    target: 'ac ? max(vc.ambient_f + ctoa, 80) : max(vc.ambient_f + td, floor)'
    sets: vc.cond_sat
    states:
      - [low, 'v < t - (ac ? 10 : 12)']
      - [high, 'v > t + (ac ? 12 : 15)']
      - [normal, 'true']
  - id: vc.discharge
    name: Discharge line temperature
    unit: °F
    systems: [vc]
    let:
      # k = typical discharge-line rise over the condensing temperature. An estimate (CoolProp at 55-65 % isentropic
      # efficiency), not maker data: R-410A/R-134a 60-90, R-404A medium-temp 50-75, low-temp and R-22 85-125.
      # k sits mid-range and the "high" line is k + 20 °F. 250 °F is the oil alarm at any head.
      k: "((ctx.app ?? 'mt') == 'lt' || (ctx.refrigerant ?? '') == 'R-22') ? 100 : 75"
    value: vc.discharge_line_f
    target: vc.cond_mid_t + k
    sets: vc.discharge_temp
    states:
      - [high, 'v > 250 || v > t + 20']
      - [low, 'v < coalesce(vc.cond_mid_t + 25, -999)']
      - [normal, 'true']
  - id: vc.evap_split
    name: Evaporator temperature split
    unit: °F
    systems: [vc.ac]
    let:
      wb: vc.air_in_wb ?? wetbulb(vc.air_in_f, vc.air_in_rh)
      band: 'has(wb) ? 3.5 : 5'
    value: vc.air_in_f - vc.air_out_f
    target: split_target(vc.air_in_f, wb) ?? 20
    sets: vc.evap_split
    states:
      - [low, 'v < t - band']
      - [high, 'v > t + band']
      - [normal, 'true']
  - id: vc.cond_rise
    name: Condenser air temperature rise
    unit: °F
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    value: vc.cond_air_out_f - vc.ambient_f
    target: '(ctx.ac_eff ?? ''standard'') == ''high'' ? 15 : 20'
    sets: vc.cond_split
    states:
      - [low, 'v < t - 8']
      - [high, 'v > t + 10']
      - [normal, 'true']
  - id: vc.amps_ratio
    name: Compressor amps vs RLA
    unit: '%'
    systems: [vc]
    requires: {hp_unit: [ducted]}   # an inverter compressor's amps follow its speed, not RLA
    value: vc.comp_amps_meas / vc.comp_rla * 100
    target: '75'
    sets: vc.comp_amps
    states:
      - [high, v > 100]
      - [low, 'v < ((ctx.app ?? ''mt'') == ''lt'' ? 35 : 50)']
      - [normal, 'true']
  - id: vc.drier_drop
    name: Drier temperature drop
    unit: °F
    systems: [vc]
    value: vc.drier_in_f - vc.drier_out_f
    target: '0'
    sets: vc.drier_dt
    states:
      - [high, v >= 3]
      - [normal, 'true']
  - id: vc.cap_dev
    name: Capacitor vs rating
    unit: '%'
    systems: [vc]
    value: vc.cap_meas_uf / vc.cap_rated_uf * 100
    target: '100'
    sets: vc.cap
    states:
      - [bad, v < 93 || v > 110]
      - [ok, 'true']
  - id: vc.standing_dev
    name: Standing pressure vs PT
    unit: psig
    systems: [vc]
    let:
      lo: psat_dew(vc.standing_temp_f)
      hi: psat_bubble(vc.standing_temp_f)
      tol: max(4, 0.04 * hi)
    value: vc.standing_psig
    target: (lo + hi) / 2
    sets: vc.standing
    states:
      - [high, v > hi + tol]
      - [low, v < lo - tol]
      - [matches, 'true']
  - id: vc.static_dev
    name: External static vs rating
    unit: in. w.c.
    systems: [vc.ac, vc.hp]
    value: vc.tesp_inwc
    target: vc.tesp_rated
    sets: vc.static
    states:
      - [high, v > t + 0.2]
      - [low, v < t * 0.4]
      - [normal, 'true']

causes:
  # ======================= refrigerant charge =======================
  - id: vc.undercharge
    name: Low refrigerant charge (leak)
    systems: [vc]
    prior: common
    keywords: [low on freon, low on refrigerant, low charge, short of gas, needs freon, needs charge, undercharged]
    signs:
      gen.output: weak
      gen.runs_constantly: yes?
      vc.evap_sat: low
      vc.superheat: high
      vc.subcool: low
      vc.cond_sat: {low: 0.4, normal: 0.55}
      vc.discharge_temp: {high: 0.4, normal: 0.55}
      vc.evap_split: {low: 0.4, normal: 0.55}
      vc.cond_split: {low: 0.4, normal: 0.55}
      vc.comp_amps: {low: 0.4, normal: 0.55}
      vc.sight_glass: bubbles
      vc.oil: yes?
      vc.leak_found: yes
      vc.evap_frost: partial?
      vc.lps_trip: yes?
      gen.short_cycle: yes?
      vc.standing: {matches: 0.72, low: 0.25, high: 0.03}
      vc.comp_hot: yes?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: {normal: 0.45, high: 0.5, low: 0.05}
          vc.evap_sat: {normal: 0.45, low: 0.5, high: 0.05}
          vc.subcool: low!
      - if: {receiver: 'yes'}
        signs:
          vc.subcool: {low: 0.45, normal: 0.5, high: 0.05}
          vc.sight_glass: bubbles!
    confirm: Superheat high with subcooling low (fixed orifice), or subcooling low with the TXV wide open (high
      superheat); bubbles in the sight glass; then find the leak.
    fix: |
      Find the leak before adding refrigerant: electronic detector along every joint, valve core and coil, bubbles
      to pinpoint, UV dye if it's slow. Repair, pressure-test with dry nitrogen, evacuate to 500 microns with a
      decay test, and weigh in the nameplate charge plus the manufacturer's line-set adjustment (liquid-charge
      blends), then trim to the subcooling (TXV) or superheat (piston) target. With a receiver there is no
      subcooling target — trim to a clear sight glass and a receiver level in range at steady head pressure.
      Replace the filter-drier whenever the system is opened.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    notes: With a TXV a small shortage hides — the valve opens up and holds superheat, so subcooling falling is the
      first tell. Superheat only climbs once the valve is wide open.
    refs: [nist-sp1087, practice]
  - id: vc.overcharge
    name: Refrigerant overcharge
    systems: [vc]
    prior: occasional
    keywords: [too much freon, too much refrigerant, overcharged, over charged]
    signs:
      gen.recent_work: yes
      gen.output: weak?
      vc.cond_sat: high
      vc.subcool: high
      vc.superheat: low
      vc.evap_sat: high?
      vc.discharge_temp: high?
      vc.comp_amps: high?
      vc.comp_sweat: yes?
      vc.standing: matches
      vc.hps_trip: yes?
      gen.short_cycle: yes?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal?
          vc.evap_sat: normal?
          vc.comp_sweat: no?
      - if: {receiver: 'yes'}
        signs:
          vc.subcool: high?
    confirm: High head pressure and high subcooling with a clean condenser and a fan that runs, and a standing
      pressure that matches the PT chart (rules out air in the system).
    fix: |
      Recover refrigerant to a recovery cylinder in small amounts until subcooling (TXV) or superheat (fixed
      orifice) reaches target at steady conditions. With a receiver, recover until the receiver sight-glass level
      is in range and head pressure is right for the ambient (a flooded condenser reads high head when overfull).
      Don't vent. If the charge history is unknown, recover it all and weigh in the nameplate charge plus the
      manufacturer's line-set adjustment, then trim to the subcooling (TXV) or superheat (piston) target — with a
      receiver, to the sight-glass level.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    refs: [nist-sp1087, practice]
  - id: vc.noncondensables
    name: Air or non-condensables in the system
    systems: [vc]
    prior: uncommon
    keywords: [air in system, noncondensables, non condensables, nitrogen left in system, bad evacuation]
    signs:
      gen.recent_work: yes
      vc.standing: high!
      vc.cond_sat: high
      vc.subcool: high?
      vc.discharge_temp: high
      vc.comp_amps: high?
      vc.cond_split: normal?
      vc.cond_dirty: no?
      vc.hps_trip: yes?
      gen.short_cycle: yes?
    confirm: With the system off and equalized at a known temperature, the standing pressure is well above the PT
      chart for that temperature.
    fix: |
      Recover the charge, find how air got in (poor evacuation, a leak on the low side running in vacuum, a
      contaminated cylinder), replace the drier, pull a deep vacuum with a decay test, and weigh in fresh
      refrigerant (the nameplate charge plus the manufacturer's line-set adjustment). Venting any refrigerant —
      CFC, HCFC or HFC — is prohibited, so don't purge off the top of the condenser; recover it.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    notes: NIST leaves non-condensables out of its running chart — the standing-pressure test is the clean way to
      catch it.
    refs: [nist-sp1087, practice]
  - id: vc.wrong_refrigerant
    name: Wrong or mixed refrigerant
    systems: [vc]
    prior: rare
    signs:
      vc.identifier: mixed!
      gen.recent_work: yes
      vc.standing: high|low
      vc.superheat: low|high?
      vc.subcool: high|low?
      gen.output: weak?
    confirm: Standing pressure doesn't match the nameplate refrigerant's PT at a known temperature, and service
      records or a refrigerant identifier point to a top-off with something else.
    fix: |
      Recover the whole charge into a cylinder marked as mixed/contaminated (it can't be reused), evacuate, and
      recharge with the nameplate refrigerant by weight (the nameplate charge plus the manufacturer's line-set
      adjustment). Check the oil type matches too.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    refs: [practice]

  # ======================= restrictions and metering =======================
  - id: vc.liquid_restriction
    name: Liquid-line restriction (plugged drier or strainer, kinked line, stuck solenoid or partly closed valve)
    systems: [vc]
    prior: occasional
    keywords: [restriction, plugged drier, clogged drier, restricted, blockage, plugged strainer, kinked line]
    signs:
      gen.output: weak
      vc.evap_sat: low
      vc.superheat: high
      vc.subcool: high
      vc.cond_sat: low|normal
      vc.discharge_temp: high?
      vc.evap_split: low?
      vc.cond_split: low?
      vc.comp_amps: low?
      vc.drier_dt: high
      vc.liquid_cold_spot: yes?
      vc.sight_glass: bubbles?
      vc.lps_trip: yes?
      gen.short_cycle: yes?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: {normal: 0.4, high: 0.55, low: 0.05}
          vc.evap_sat: {normal: 0.4, low: 0.55, high: 0.05}
          vc.evap_split: {normal: 0.6, low: 0.35}
          vc.cond_split: {normal: 0.6, low: 0.35}
    confirm: Temperature drop across the drier (3 °F or more) or a frosty/sweaty spot on the liquid line, with high
      subcooling and high superheat.
    fix: |
      Find the spot where the temperature drops: drier, strainer, solenoid, service valve, kinked or crushed tubing.
      Recover or pump down, replace the drier (and core/strainer), straighten or replace the tubing, and check
      the solenoid opens fully (coil voltage, stem). Evacuate and recharge with the nameplate charge plus the
      manufacturer's line-set adjustment, then trim to the subcooling (TXV) or superheat (piston) target.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    notes: NIST SP 1087 found a mild restriction invisible on a TXV unit until the valve ran out of stroke.
      Sources disagree on the high-superheat + high-subcooling row; a starving TXV and an undersized piston
      look the same, so check the drier drop and the TXV bulb before condemning anything.
    refs: [nist-sp1087, practice]
  - id: vc.suction_restriction
    name: Suction line or service valve restricted — valve not back-seated, crushed or kinked line, plugged strainer
    systems: [vc]
    prior: uncommon
    keywords: [suction restriction, service valve not open, crushed suction line, plugged suction strainer]
    signs:
      gen.output: weak
      vc.evap_sat: low
      vc.superheat: high
      vc.cond_sat: low
      vc.comp_amps: low
      vc.discharge_temp: high?
      gen.recent_work: yes?
      vc.lps_trip: yes?
    confirm: Suction at the compressor is lower than at a gauge on the evaporator side of the suspect point (more than
      2–3 psi on medium-temp, about 1 psi on low-temp), or a cold or frosted spot at a service valve or kink. Common
      right after the system was opened.
    fix: |
      Open the suspect service valve fully (back-seat it, then crack it off the seat for the gauge port). Look for kinks
      and crushed tubing, and clean or replace a suction strainer. If the pressure drop is across a drier or filter, replace it.
    refs: [practice]
  - id: vc.txv_underfeed
    name: TXV underfeeding — stuck closed, lost bulb charge, plugged inlet screen or ice in the valve
    systems: [vc]
    requires: {metering: [txv, eev]}
    prior: occasional
    keywords: [txv stuck closed, expansion valve stuck, bad txv, txv starving, lost bulb charge, bad power head]
    signs:
      gen.output: weak
      vc.superheat: high!
      vc.evap_sat: low
      vc.subcool: high
      vc.cond_sat: normal?
      vc.drier_dt: normal
      vc.liquid_cold_spot: no?
      vc.txv_bulb: no_response
      vc.evap_frost: partial?
      vc.sight_glass: clear?
      vc.lps_trip: yes?
      gen.short_cycle: yes?
    confirm: High superheat and high subcooling with no drop across the drier, and the valve doesn't open when its
      bulb is warmed.
    fix: |
      Check the bulb is tight and in the right place first. Warm the bulb: no rise in suction means a dead power
      head or a stuck valve. Pump down, check the inlet screen, and replace the power head or the valve (match the
      refrigerant and capacity). If it works intermittently and the moisture indicator shows wet, moisture is
      freezing at the port — replace the drier and evacuate deeply.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    refs: [practice]
  - id: vc.txv_overfeed
    name: TXV overfeeding — stuck open, bulb loose or uninsulated, oversized valve or superheat set too low
    systems: [vc]
    requires: {metering: [txv, eev]}
    prior: occasional
    keywords: [txv stuck open, txv flooding, expansion valve flooding, overfeeding]
    signs:
      vc.superheat: low!
      vc.evap_sat: high
      vc.subcool: low?
      vc.cond_sat: normal?
      vc.discharge_temp: low
      vc.comp_sweat: yes
      vc.comp_noise: knock?
      vc.comp_amps: high?
      vc.bulb_mount: poor?
      vc.txv_bulb: responds?
    confirm: Superheat near zero at the evaporator with a sweating or frosted compressor; check the bulb mounting
      before blaming the valve.
    fix: |
      Re-mount the bulb tight on a clean, straight run of suction line (4 or 8 o'clock on larger lines) and
      insulate it. If superheat is still low, turn the adjusting stem clockwise (in) a quarter turn at a time to
      raise superheat, waiting 15 minutes between turns; on an EEV, change the controller's superheat setpoint
      instead. A valve that won't throttle when the bulb is iced is stuck open — replace it. Liquid floodback
      kills compressors, so don't leave it running flooded.
    refs: [practice]
  - id: vc.piston_large
    name: Metering orifice too large or piston missing
    systems: [vc]
    requires: {metering: fixed}
    prior: uncommon
    signs:
      gen.recent_work: yes?
      vc.superheat: low!
      vc.evap_sat: high
      vc.subcool: low
      vc.discharge_temp: low?
      vc.comp_sweat: yes?
      vc.cond_sat: low?
    confirm: Superheat stays low at a correct charge; the piston size stamped on it is larger than the outdoor
      unit's documentation calls for (common after a coil or condensing unit was swapped).
    fix: |
      Recover, pull the piston and compare the size with the condensing unit's literature (the outdoor unit
      decides it). Install the correct piston with a new O-ring/seal, replace the drier, evacuate and weigh in the
      nameplate charge plus the manufacturer's line-set adjustment, then trim to the superheat target.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    refs: [practice]
  - id: vc.metering_small
    name: Metering device too small or partly plugged (piston or cap tube)
    systems: [vc]
    requires: {metering: [fixed, captube]}
    prior: uncommon
    keywords: [cap tube plugged, capillary tube restricted, piston plugged, wrong piston]
    signs:
      gen.output: weak
      vc.superheat: high
      vc.evap_sat: low
      vc.subcool: high
      vc.cond_sat: normal|high
      vc.drier_dt: normal?
      vc.evap_frost: partial?
      vc.sight_glass: clear?
    confirm: High superheat and high subcooling with no drier drop; frost right after the metering device; the
      piston size doesn't match the literature, or the cap tube is kinked or plugged (wax, debris, moisture).
    fix: |
      For a piston: recover, inspect and clean or replace with the correct size. For a cap tube: look for kinks;
      a plugged cap tube is replaced (with the drier) or cleared with a cap-tube cleaner by a shop with the right
      tool. Evacuate deeply and weigh in the nameplate charge plus the manufacturer's line-set adjustment, then trim
      a piston system to the superheat target — cap-tube systems are critically charged, so don't trim them by
      gauge readings.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    refs: [practice]
  - id: vc.moisture
    name: Moisture in the system
    systems: [vc]
    prior: uncommon
    signs:
      vc.moisture_ind: wet!
      gen.intermittent: yes
      gen.recent_work: yes?
      vc.superheat: high?
      vc.evap_sat: low?
    confirm: Moisture indicator reads wet after the system has run a while; feed comes and goes as ice forms and
      melts at the metering device.
    fix: |
      Recover the charge, replace the filter-drier (oversize it or add a suction-line drier if acid is
      suspected — test the oil), evacuate to 500 microns or lower with a decay test, and recharge with the nameplate
      charge plus the manufacturer's line-set adjustment, then trim to the subcooling (TXV) or superheat (piston)
      target.
    safety: R-32, R-454B (A2L) and R-290/R-600a (A3) are flammable — no ignition sources, ventilate, use a rated
      recovery machine and leak detector, and follow the nameplate before brazing. Pressure-test with nitrogen
      through a regulator and never above the lowest test pressure on the nameplate; never use air or oxygen. Fill a
      recovery cylinder to 80 % by weight at most.
    refs: [practice]

  # ======================= air across the evaporator =======================
  - id: vc.dirty_filter
    name: Dirty or clogged air filter
    systems: [vc.ac]
    prior: very_common
    keywords: [dirty filter, clogged filter, change filter]
    signs:
      vc.filter: dirty!
      gen.output: weak
      vc.evap_fan: weak?
      vc.evap_sat: low
      vc.superheat: low
      vc.subcool: normal?
      vc.cond_sat: low?
      vc.evap_split: high
      vc.evap_frost: partial|heavy
      vc.static: high?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal?
      - if: {metering: [fixed, captube]}
        signs:
          vc.subcool: low|normal
    confirm: Filter visibly loaded; temperature split high; suction low.
    fix: |
      Replace the filter (and thaw the coil first if it's iced — run the fan only, or heat). Check that the
      filter size and MERV rating suit the blower; a too-restrictive filter acts like a dirty one.
    refs: [nist-sp1087, practice]
  - id: vc.dirty_evap
    name: Dirty evaporator coil
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    prior: occasional
    keywords: [dirty evaporator, dirty evap coil, plugged evaporator]
    signs:
      vc.evap_dirty: yes!
      gen.output: weak
      vc.evap_sat: low
      vc.superheat: low
      vc.subcool: normal?
      vc.cond_sat: low?
      vc.evap_split: high
      vc.evap_frost: partial|heavy
      vc.evap_fan: weak?
      vc.static: high?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal?
      - if: {metering: [fixed, captube]}
        signs:
          vc.subcool: low|normal
    confirm: Matted face on the air-entering side of the coil; high split; low suction.
    fix: |
      Power off. Clean the coil with a coil cleaner and low-pressure water from the leaving-air side (keep water off
      the blower motor and control board), straighten fins, and check the drain afterward. Find out why it got
      dirty (filter missing, bypass around the filter).
    refs: [nist-sp1087, practice]
  - id: vc.evap_fan_weak
    name: Evaporator fan or blower running slow or weak (capacitor, speed tap, dirty wheel, slipping belt, failing
      ECM)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    prior: occasional
    keywords: [blower slow, weak blower, blower capacitor, dirty blower wheel, slipping belt]
    signs:
      vc.evap_fan: weak!
      gen.output: weak
      vc.evap_sat: low
      vc.superheat: low
      vc.evap_split: high
      vc.evap_frost: partial|heavy
      vc.filter: clean?
      vc.evap_dirty: no?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal?
      - if: {metering: [fixed, captube]}
        signs:
          vc.subcool: low|normal
    confirm: Fan turns but moves little air; blower amps low, wheel loaded with dirt, capacitor low, belt slipping
      or the wrong speed tap selected.
    fix: |
      Test the blower capacitor, clean the wheel, set the right speed tap (or ECM airflow setting), and tension or
      replace the belt. Check motor amps against nameplate and the bearings for drag.
    safety: Lock out before reaching into a fan or testing a capacitor; discharge the capacitor through a resistor,
      not a screwdriver.
    refs: [practice]
  - id: vc.evap_fan_off
    name: Evaporator fan or blower not running (motor, capacitor, relay, control board or fan delay)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    prior: occasional
    keywords: [blower motor bad, evaporator fan motor bad, fan motor failed, blower not working]
    signs:
      vc.evap_fan: off!
      gen.output: none|weak
      vc.evap_sat: low!
      vc.superheat: low
      vc.evap_frost: heavy
      vc.comp_sweat: yes?
      vc.lps_trip: yes?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal|low
    confirm: Fan not turning with a call present. Check voltage at the motor — present means the motor or its
      capacitor; absent means the relay, board or fan control.
    fix: |
      With voltage at the motor and nothing turning: check the capacitor, spin the shaft for seized bearings,
      ohm the windings (and the thermal protector). Without voltage: check the fan relay, board output, door
      switch, and fan-delay controls. Thaw the coil before testing the refrigeration side.
    safety: Lock out before reaching into a fan or testing a capacitor; discharge the capacitor through a resistor,
      not a screwdriver.
    refs: [practice]
  - id: vc.duct_restriction
    name: Duct restriction — closed registers or dampers, crushed or undersized duct
    systems: [vc.ac]
    prior: uncommon
    signs:
      vc.ducts: restricted!
      vc.static: high
      gen.output: weak
      vc.evap_sat: low
      vc.superheat: low?
      vc.evap_split: high
      vc.evap_frost: partial?
      vc.filter: clean?
    confirm: High external static with a clean filter and coil; closed or crushed runs.
    fix: Open dampers and registers, repair crushed flex, and add return capacity if the return is undersized.
    refs: [practice]
  - id: vc.duct_leak
    name: Duct leak or disconnect (return pulling in hot attic or outdoor air, supply dumping into a void)
    systems: [vc.ac]
    prior: uncommon
    signs:
      vc.ducts: leaking!
      gen.output: weak
      gen.runs_constantly: yes?
      vc.evap_sat: high?
      vc.superheat: high?
      vc.evap_split: low?
      vc.static: low?
    confirm: Return air at the unit much warmer than the room; a disconnected or torn duct.
    fix: Reconnect and seal (mastic or listed tape), and insulate ducts in unconditioned spaces.
    refs: [practice]
  - id: vc.excess_load
    name: Heat load more than the unit can handle (very hot or humid day, undersized, extra equipment)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    prior: occasional
    signs:
      gen.output: weak
      gen.runs_constantly: yes!
      vc.evap_sat: {normal: 0.6, high: 0.35}
      vc.superheat: normal?
      vc.cond_sat: {normal: 0.6, high: 0.35}
      vc.evap_split: low?
      vc.subcool: normal?
      vc.comp_amps: high?
    confirm: Pressures high on both sides but in proportion, charge and airflow correct, unit runs nonstop.
    fix: |
      Confirm charge and airflow are right first. Then the fix is load or capacity: shade, seal, cut internal
      loads, or a larger unit. On refrigeration, check for warm product loading, door use and failed door heaters
      or gaskets.
    refs: [practice]

  # ======================= air across the condenser =======================
  - id: vc.dirty_condenser
    name: Dirty or blocked condenser coil
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    prior: very_common
    keywords: [dirty condenser, clean condenser, plugged condenser, dirty coil]
    signs:
      vc.cond_dirty: yes!
      vc.cond_sat: high
      vc.subcool: low|normal
      vc.superheat: low?
      vc.evap_sat: {normal: 0.6, high: 0.35}
      vc.evap_split: {normal: 0.6, low: 0.35}
      vc.discharge_temp: {normal: 0.5, high: 0.5}
      vc.comp_amps: {normal: 0.5, high: 0.5}
      vc.cond_split: high?
      vc.hps_trip: yes?
      vc.comp_hot: yes?
      gen.short_cycle: yes?
      gen.output: weak?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal?
          vc.cond_split: normal|high?
    confirm: Head pressure high for the outdoor temperature with the fan running, and a matted or dirty coil.
    fix: |
      Power off. Clean from the inside out with coil cleaner and low-pressure water (or brush and vacuum on
      fragile fins), comb the fins, and clear debris from around the unit. Re-check head pressure afterwards.
    refs: [nist-sp1087, practice]
  - id: vc.cond_blocked
    name: Condenser air blocked or recirculating (snow, walls, stacked units, wind)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    prior: occasional
    keywords: [snow drift, buried condenser, recirculation, blocked condenser]
    signs:
      vc.cond_airpath: blocked!
      vc.cond_dirty: no?
      vc.cond_sat: high
      vc.discharge_temp: {normal: 0.5, high: 0.5}
      vc.comp_amps: {normal: 0.5, high: 0.5}
      vc.evap_split: low?
      vc.hps_trip: yes?
      vc.subcool: low|normal
      gen.short_cycle: yes?
    confirm: The air going into the condenser is warmer than the outdoor air, or the coil is boxed in or drifted
      over.
    fix: Clear snow and debris, open the space around the unit, add baffles or relocate so discharge air can't
      loop back into the inlet.
    refs: [practice]
  - id: vc.cond_fan_failed
    name: Condenser fan not running (motor, capacitor, contactor or fan control)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    prior: common
    keywords: [condenser fan motor bad, outdoor fan motor bad, fan motor seized]
    signs:
      vc.cond_fan: off!
      vc.cond_sat: high!
      vc.hps_trip: yes?
      vc.comp_hot: yes?
      vc.comp_amps: high
      vc.discharge_temp: high
      gen.short_cycle: yes?
      gen.output: weak|none
    confirm: Compressor running, fan still. Voltage at the fan motor — present means motor or capacitor; absent
      means the contactor, relay or fan-cycling control.
    fix: |
      Shut the compressor off before head pressure trips it repeatedly. Test the fan capacitor, spin the blade
      (seized bearings), ohm the windings, and check voltage at the motor. Replace with matching HP, RPM,
      rotation and frame. Check the fan-cycling or head-pressure control if voltage never reaches the motor.
    safety: Lock out before reaching into a fan or testing a capacitor; discharge the capacitor through a resistor,
      not a screwdriver.
    refs: [practice]
  - id: vc.cond_fan_slow
    name: Condenser fan weak or slow (capacitor, bearings, wrong blade or rotation)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    prior: occasional
    signs:
      vc.cond_fan: slow!
      vc.cond_sat: high
      vc.discharge_temp: high?
      vc.comp_amps: high?
      vc.cap: bad?
    confirm: Fan turns slower than its siblings or than nameplate RPM, wobbles, or blows the wrong way.
    fix: Test and replace a weak capacitor, check bearings and blade pitch, correct rotation, and confirm the
      blade is the right one for the motor.
    safety: Lock out before reaching into a fan or testing a capacitor; discharge the capacitor through a resistor,
      not a screwdriver.
    refs: [practice]
  - id: vc.low_ambient
    name: Running in cold outdoor air without low-ambient control
    systems: [vc.ac]
    requires: {condenser: air}
    prior: occasional
    keywords: [low ambient, cold weather, winter operation, server room ac winter]
    signs:
      vc.low_ambient: yes!
      vc.cond_sat: low
      vc.evap_sat: low
      vc.superheat: high?
      vc.subcool: high?
      vc.evap_frost: partial|heavy
      gen.output: weak
      vc.comp_sweat: yes?
      gen.short_cycle: yes?
    confirm: Head pressure low because the outdoor air is cold; the coil ices and suction falls.
    fix: |
      Add or repair a low-ambient kit (fan cycling or fan-speed head pressure control, crankcase heater, low-ambient
      thermostat or a hard-start/time-delay as the maker specifies). For year-round cooling loads (server rooms),
      use equipment rated for low ambient or an economizer.
    refs: [practice]

  # ======================= compressor =======================
  - id: vc.comp_inefficient
    name: Compressor not pumping — worn or leaking valves, worn scroll, internal bypass
    systems: [vc]
    prior: uncommon
    keywords: [bad compressor, weak compressor, compressor valves, compressor not pumping, inefficient compressor]
    signs:
      gen.output: weak
      gen.runs_constantly: yes?
      vc.evap_sat: high
      vc.cond_sat: low
      vc.subcool: low
      vc.superheat: low?
      vc.discharge_temp: {high: 0.5, normal: 0.45}
      vc.evap_split: low
      vc.cond_split: low
      vc.comp_amps: {low: 0.6, normal: 0.35}
      vc.pumpdown: weak!
      vc.comp_noise: knock?
    when:
      - if: {metering: [txv, eev]}
        signs:
          vc.superheat: normal
    confirm: Suction high and head low together with low amps; the compressor can't pump down — or, on a non-bleed
      TXV with the liquid valve closed, pressures equalize within a minute or two after shutdown (a piston, cap
      tube or bleed-port TXV equalizes by itself, so that proves nothing there).
    fix: |
      Confirm with a pump-down or compressor efficiency test before condemning it, and rule out an open internal
      relief valve after a high-pressure event and (on heat pumps) a reversing valve leaking through. On a
      three-phase scroll, prove the phase rotation first — a reversed scroll looks exactly like a worn one.
      Replace the compressor, the drier (suction drier if it burned), and test the oil for acid.
    refs: [nist-sp1087, practice]
  - id: vc.comp_cap
    name: Compressor run capacitor failed (or the HERM side of a dual capacitor)
    systems: [vc]
    prior: common
    keywords: [bad capacitor, compressor capacitor, run capacitor, dual capacitor]
    signs:
      vc.comp: {hums: 0.65, running: 0.2, off: 0.15}
      vc.cap: bad!
      vc.comp_hot: yes?
      vc.windings: ok?
      gen.breaker: ok?
      vc.comp_amps: high?
    confirm: Capacitor reads low or open (or is bulged) and the compressor hums and trips on overload — or, when
      the capacitor is only weak, the compressor starts, runs hot with high amps and trips on its overload.
    fix: |
      Discharge the capacitor through a resistor and replace it with the same µF and equal or higher voltage
      rating. If the compressor still won't start on a good capacitor, try a hard-start kit (single-phase only, two
      start attempts at most); if that fails, the compressor is locked or a winding is bad.
    safety: Lock out before reaching into a fan or testing a capacitor; discharge the capacitor through a resistor,
      not a screwdriver.
    refs: [practice]
  - id: vc.fan_cap
    name: Condenser fan capacitor failed (or the FAN side of a dual capacitor)
    systems: [vc.ac, vc.walkin, vc.reachin, vc.ice]
    requires: {condenser: air}
    prior: common
    signs:
      vc.cond_fan: off|slow
      vc.cap: bad!
      vc.cond_sat: high
      vc.comp_hot: yes?
      vc.hps_trip: yes?
      gen.short_cycle: yes?
    confirm: Fan hums but doesn't spin (or starts only when pushed); the FAN–C side tests low.
    fix: Replace with matching µF and voltage. If the fan was running hot for a while, check the motor bearings
      too.
    safety: Lock out before reaching into a fan or testing a capacitor; discharge the capacitor through a resistor,
      not a screwdriver.
    refs: [practice]
  - id: vc.contactor
    name: Contactor failed — open coil or burnt contacts
    systems: [vc]
    prior: common
    keywords: [bad contactor, contactor burnt, pitted contacts]
    signs:
      vc.contactor: {not_pulling: 0.4, burnt: 0.5, welded: 0.02, ok: 0.08}
      vc.coil_24v: yes
      vc.comp: {off: 0.6, hums: 0.3, running: 0.1}
      gen.call: calling?
      gen.power: present
      gen.output: none
    confirm: 24 V on the coil but it won't pull in (open coil); or pulled in with voltage lost across the contacts.
      A contactor welded closed is its own cause (the unit runs with no call).
    fix: |
      Replace the contactor (match coil voltage, poles and amp rating). Look for why it burned: loose terminals,
      a hard-starting compressor, or chattering from low control voltage. Ants and dirt in the contacts are a
      classic cause on outdoor units.
    refs: [practice]
  - id: vc.contactor_welded
    name: Contactor welded closed — unit runs with no call
    systems: [vc]
    prior: occasional
    keywords: [contactor stuck closed, contactor welded, runs with thermostat off, wont shut off]
    signs:
      vc.contactor: welded!
      gen.call: not_calling!
      vc.comp: running
      vc.evap_frost: partial|heavy?
    confirm: The compressor and fans run with the call off; the contactor stays in with no 24 V on its coil.
    fix: |
      Lock out. Replace the contactor (match coil voltage, poles and amp rating) and find why it welded: a hard-starting
      compressor, loose terminals, low control voltage that made it chatter. Check for an iced coil after a long run.
    safety: Lock out; a welded contactor means the unit can start at any moment.
    refs: [practice]
  - id: vc.safety_open
    name: A safety in the control circuit is open (pressure switch, float switch, overload pilot, freeze stat)
    systems: [vc]
    prior: occasional
    signs:
      vc.contactor: not_pulling
      vc.coil_24v: no!
      gen.call: calling
      gen.control_v: present
      gen.output: none
      vc.comp: off!
    confirm: The call reaches the unit but the 24 V stops at a safety. Meter across each switch in the circuit —
      the open one shows 24 V across it.
    fix: |
      Don't just jumper it: a tripped safety is a messenger. High pressure → condenser, fan, charge, air in the
      system. Low pressure → charge, restriction, airflow, iced coil. Float switch → clogged drain. Fix the cause,
      then reset. Replace a switch only if it's open at normal pressures or levels.
    refs: [practice]
  - id: vc.comp_locked
    name: Compressor locked or hard to start (mechanical, or pressures not equalized)
    systems: [vc]
    prior: occasional
    keywords: [locked rotor, seized compressor, compressor stuck, hard start]
    signs:
      vc.comp: hums!
      vc.cap: ok!
      # Usually read after it has cooled (windings fine); while hot the internal overload shows open.
      # Not an even split — keep the weights.
      vc.windings: {ok: 0.6, overload_open: 0.35}
      vc.comp_hot: yes?
      vc.comp_amps: high?
      gen.voltage: normal?
      gen.output: none
    confirm: Good capacitor, good windings, good voltage — it still hums at locked-rotor amps and trips.
    fix: |
      Let pressures equalize (TXV systems without a bleed need minutes). Single-phase only: then try a hard-start
      kit (start capacitor and relay) sized for the compressor, and limit yourself to two start attempts — each
      locked-rotor start heats the winding. On a three-phase compressor check all three legs, the fuses and each
      contactor pole first; no hard-start kit exists for it. If it still won't start, replace the compressor — and
      find why it failed (floodback, overheating, low oil).
    refs: [practice]
  - id: vc.comp_windings
    name: Compressor windings open, shorted or grounded
    systems: [vc]
    prior: occasional
    keywords: [compressor grounded, burned out compressor, compressor shorted, open winding]
    signs:
      vc.windings: open|shorted|grounded
      vc.comp: off|hums
      gen.breaker: {retrips: 0.45, ok: 0.4, tripped: 0.15}
      gen.burnt_smell: yes?
      gen.output: none
    confirm: Ohm readings don't add up (R–S ≠ C–R + C–S), a winding reads open after the compressor has cooled
      for an hour, or any terminal reads to ground.
    fix: |
      Replace the compressor. A burnout means acid: test the oil, install a suction-line filter-drier (acid
      core) and a new liquid drier, flush or clean as needed, evacuate deeply. Check the contactor and capacitor
      before starting the new one.
    safety: A grounded compressor can blow its terminals out — never energize it to test.
    refs: [practice]
  - id: vc.single_phase
    name: Three-phase compressor single-phased — one leg lost (blown fuse, burnt contactor pole, loose lug, utility)
    systems: [vc]
    requires: {phases: three}
    prior: occasional
    keywords: [single phasing, lost a leg, lost phase, one fuse blown, phase loss, hums three phase]
    signs:
      vc.phase: phase_loss!
      vc.comp: {hums: 0.5, off: 0.3, running: 0.2}
      gen.output: none
      vc.comp_hot: yes?
      vc.comp_amps: high?
      gen.breaker: tripped?
      gen.after_outage: yes?
    confirm: One pair of legs reads far below the other two, or a leg drops across a contactor pole; a compressor that
      was running draws high amps on the two good legs and trips its overload.
    fix: |
      Lock out. Work back from the compressor: voltage in and out of each contactor pole, the fuses in the disconnect
      (one blown fuse is the classic), lugs and terminals for heat, then the supply. Replace the whole fuse set and any
      burnt contactor or lug. Before restarting, meter the windings (T1–T2, T2–T3 and T1–T3 equal, none to ground).
      Don't keep re-trying a humming compressor — every locked-rotor start heats the windings.
    safety: Lock out; a lost leg can still leave the other two live. Verify dead with a tested meter.
    refs: [practice]
  - id: vc.phase_reversed
    name: Scroll compressor running backwards — phase sequence reversed after power, generator or wiring work
    systems: [vc]
    requires: {phases: three}
    prior: rare
    keywords: [scroll backwards, phase reversed, wrong rotation, noisy compressor not pumping, generator phases]
    signs:
      vc.rotation: reversed!
      gen.recent_work: yes!
      gen.after_outage: yes?
      vc.comp: running
      vc.comp_amps: low
      vc.evap_sat: high
      vc.cond_sat: low
      gen.output: weak|none
      vc.comp_hot: yes?
      vc.pumpdown: weak
    confirm: A phase-sequence tester reads reversed, or the compressor is loud and pumps nothing right after power or
      wiring work (suction doesn't fall, head doesn't rise).
    fix: |
      Shut it down — a reversed scroll overheats, trips its protector and can fail if left running. Lock out and swap
      any two line leads: at the compressor's contactor (load side) if only the compressor is wrong, or at the
      disconnect if the fans are backwards too; then check the rotation of every three-phase motor. Confirm with a
      rotation meter; suction should fall and head should rise within seconds.
      Do not condemn the compressor on this signature until rotation is proven.
    safety: Lock out; verify dead before swapping leads.
    refs: [practice]
  - id: vc.start_relay
    name: Start capacitor, relay or PTC failed — single-phase compressor hums and won't start
    systems: [vc]
    requires: {phases: single}
    prior: occasional
    keywords: [start relay, potential relay, start capacitor, ptc relay, hard start kit, hums and trips on overload]
    signs:
      vc.comp: hums!
      vc.start_parts: bad!
      vc.cap: ok?
      vc.windings: ok?
      vc.comp_hot: yes?
      gen.output: none
    confirm: Run capacitor and windings test good, but the start capacitor is open or low, the relay coil reads open or its
      contacts are pitted or stuck, or the PTC is open.
    fix: |
      Lock out and discharge the capacitors. Replace the start capacitor, relay or PTC with the exact manufacturer's
      part — relay pick-up and drop-out are matched to the compressor, and a wrong relay burns the start winding.
      Replace an old run capacitor at the same time. If it still won't start, the compressor is stuck or a winding is bad.
    safety: Lock out; discharge capacitors through a resistor before touching them.
    refs: [practice]
  - id: vc.overheat_overload
    name: Compressor overheating and cycling on its internal overload
    systems: [vc]
    prior: occasional
    signs:
      vc.comp_hot: yes!
      vc.windings: overload_open?
      gen.short_cycle: yes
      vc.comp: off|running
      vc.discharge_temp: high?
      vc.superheat: high?
    confirm: The compressor is too hot to touch and its internal overload opens (C–R and C–S open, R–S fine) until
      it cools.
    fix: |
      It's a symptom — find why it's hot: low charge (high return-gas superheat), high head (dirty condenser,
      fan), low voltage, a weak run capacitor, or short cycling. Lock out, then let it cool on its own (the
      internal overload resets in 30–60 minutes); a fan on the shell is fine. Fix the root cause before
      restarting.
    safety: Never spray water on a compressor or its terminal box.
    refs: [practice]

  # ======================= A/C basics =======================
  - id: vc.drain_clogged
    name: Condensate drain clogged (pan full, float switch tripped, water leaking)
    systems: [vc.ac]
    prior: very_common
    keywords: [clogged drain, condensate line clogged, float switch, drain pan full, water leaking from ac]
    signs:
      vc.drain: clogged!
      gen.water_leak: yes
      gen.output: {none: 0.45, normal: 0.4, weak: 0.15}
      vc.comp: {running: 0.55, 'off': 0.44, hums: 0.01}
      vc.coil_24v: no?
      gen.breaker: ok?
    confirm: Water standing in the pan or the float switch open; drain line holds water.
    fix: |
      Clear the line (wet-vac from the outside end, or flush), clean the trap and pan, add a pan treatment tablet,
      and confirm the float switch resets and actually cuts the unit. Check the trap is primed and the line slopes.
    refs: [practice]
  - id: vc.control_cycling
    name: Short cycling from controls (thermostat placement or differential, oversized unit)
    systems: [vc]
    prior: common
    signs:
      gen.short_cycle: yes!
      vc.lps_trip: no
      vc.hps_trip: no
      vc.comp_hot: no?
      vc.evap_sat: normal?
      vc.cond_sat: normal?
      vc.superheat: normal?
    confirm: Pressures normal and no safety trips; the control satisfies within minutes (stat in a supply-air path,
      sun, near a door; controller differential too tight), or the unit is oversized.
    fix: Move or shield the sensor, widen the differential or set minimum on/off times, add an anti-short-cycle
      delay. An oversized unit needs staging or a smaller unit.
    refs: [practice]
