module: systems
title: Systems, context questions and references (shared by every module)

systems:
  # ---------------- refrigeration & A/C (vapor compression) ----------------
  - id: vc
    name: Refrigeration & A/C
    abstract: true
    # How a call with nothing wrong in the system gets reported: mostly "not enough", seldom "nothing at all".
    ok_signs: &ok_signs {gen.output: {weak: 0.6, normal: 0.3, none: 0.1}}
  - id: vc.ac
    parent: vc
    name: A/C or heat pump — cooling
    output: cooling
    short: A/C cooling
    icon: snow
    keywords: [air conditioner, ac, a/c, central air, split system, mini split, ductless, rooftop, rtu, packaged unit,
      condensing unit, heat pump cooling, cooling, ptac, window unit, server room unit, crac]
    ok_note: Charge, airflow and pressures read normal. Check the thermostat or controller settings, duct leaks or
      closed registers, the indoor heat load, and whether the unit is simply undersized for the space.
  - id: vc.hp
    parent: vc
    name: Heat pump — heating mode
    output: heat
    short: Heat pump heat
    icon: sun
    keywords: [heat pump heating, heat pump heat, defrost, reversing valve, aux heat, auxiliary heat, emergency heat,
      strip heat, outdoor coil iced, heat pump frozen, cold air from vents]
    ok_note: The refrigerant side reads normal for heating. Check the thermostat staging (aux heat lockout), duct
      losses, and whether the outdoor temperature is below the unit's balance point.
  - id: vc.walkin
    parent: vc
    name: Walk-in cooler or freezer
    output: cooling
    short: Walk-in
    icon: box
    keywords: [walk in, walk-in, cooler, freezer, box, cold room, reefer, meat locker, unit cooler, galley cooler,
      galley freezer, cold storage, evaporator, condensing unit]
    ok_note: The refrigeration circuit reads normal. Check door use and gaskets, warm product loaded recently,
      the controller setpoint and probe, and the defrost schedule.
  - id: vc.reachin
    parent: vc
    name: Reach-in, prep table or display case
    output: cooling
    short: Reach-in
    icon: fridge
    keywords: [reach in, reach-in, undercounter, under counter, prep table, sandwich unit, salad unit, display case,
      merchandiser, beverage cooler, self contained, self-contained, refrigerator, fridge, glass door]
    ok_note: The sealed system reads normal. Check door use and gaskets, loading (blocked air paths), the controller
      setpoint and probe placement, and the room temperature around the condenser.
  - id: vc.ice
    parent: vc
    name: Ice machine
    output: ice
    short: Ice machine
    icon: ice
    keywords: [ice machine, ice maker, icemaker, ice bin, harvest, ice thickness, ice bridge, slow ice, no ice,
      cube, flake ice, nugget ice]
    ok_note: The refrigeration side reads normal. Check water supply and filters, water temperature, scale, the
      ice thickness setting, and the room temperature.

  # ---------------- oil-fired heating ----------------
  - id: fuel
    name: Oil-fired heating
    abstract: true
    # a hazard complaint is never "nothing wrong" (CO, an oil leak, a relief valve lifting)
    ok_signs: {<<: *ok_signs, blr.co_room: {'no': 0.995, 'yes': 0.005}, blr.oil_leak: {'no': 0.998, 'yes': 0.002},
      blr.relief: {ok: 0.97, weeping: 0.025, popping: 0.005}}
  - id: fuel.boiler
    parent: fuel
    name: Boiler & oil burner
    output: heat
    short: Oil boiler
    icon: flame
    keywords: [boiler, oil boiler, burner, oil burner, gun burner, lockout, reset button, primary control, cad cell,
      nozzle, igniter, ignitor, electrodes, flame, soot, smoke, puffback, aquastat, low water cutoff, lwco,
      pressuretrol, steam boiler, hot water boiler, fuel oil, an8, jp8, jp-8, diesel, arctic diesel]
    ok_note: The burner and boiler read normal. Check the call for heat and the distribution side (pumps, zone
      valves, air in the loop), and whether the load exceeds the boiler's rating.
  - id: fuel.furnace
    parent: fuel
    name: Oil-fired warm-air furnace
    output: heat
    short: Oil furnace
    icon: flame
    keywords: [furnace, oil furnace, warm air furnace, forced air, blower, limit switch, fan limit, heat exchanger,
      hot air heater]
    ok_note: The burner and furnace read normal. Check the call for heat, the filter and ducts, and the blower.

  # ---------------- water & steam distribution ----------------
  - id: hydronic
    name: Hot-water & glycol loop
    ok_signs: {<<: *ok_signs, hyd.relief_weeping: {'no': 0.97, weeping: 0.025, discharging: 0.005}}
    output: heat
    short: Hydronic loop
    icon: drop
    keywords: [hydronic, hot water heat, glycol, glycol loop, heating loop, loop, circulator, circ pump, pump,
      expansion tank, relief valve, air in lines, gurgling, no heat in zone, zone valve, heat exchanger,
      plate exchanger, waste heat, heat recovery, domestic hot water, dhw, indirect]
    ok_note: The loop reads normal. Check the heat source (boiler or heat recovery) and the controls calling the
      zone, and compare the load with what the terminal units can deliver.
  - id: steam
    name: Steam heat & condensate
    ok_signs: *ok_signs
    output: heat
    short: Steam
    icon: steam
    keywords: [steam, steam heat, steam trap, trap, condensate, condensate pump, water hammer, banging pipes,
      steam main, radiator valve, vacuum pump, flash steam]
    ok_note: The steam side reads normal. Check the boiler's pressure control and water level, and the zone
      controls.

  # ---------------- terminal units (kb/terminal.yaml) ----------------
  - id: terminal
    name: Unit heater, fan coil or baseboard
    ok_signs: *ok_signs
    output: heat
    short: Terminal unit
    icon: sun
    keywords: [unit heater, fan coil, fcu, cabinet heater, cabinet unit heater, cuh, baseboard, fin tube, convector,
      radiator, radiant, radiant panel, radiant floor, electric heater, electric baseboard, electric unit heater,
      wall heater, kickspace heater, unit heater blowing cold, cabinet heater blowing cold, fan coil blowing cold,
      terminal unit, steam unit heater, hot water unit heater, glycol unit heater]
    ok_note: The unit itself reads normal — hot water or steam reaches it, the valve opens, the coil heats evenly
      and the fan moves air (or the elements draw full current). Compare the unit's rating with the room's heat
      loss (doors, infiltration, a cold snap, an exhaust fan), check the thermostat setpoint and schedule, and if
      several units are short, work the loop or boiler in the Hydronic or Steam system.

  # ---------------- air handling ----------------
  - id: ahu
    name: Air handler & ventilation
    ok_signs: *ok_signs
    output: air
    short: Air handler
    icon: fan
    keywords: [air handler, air handling unit, ahu, fan, supply fan, exhaust fan, return fan, belt, sheave, damper,
      economizer, outside air, outdoor air, filter, coil, heating coil, preheat, freezestat, freeze stat,
      low limit, vfd, drive, makeup air, ventilation, mau, hrv, erv, static pressure, airflow]
    ok_note: The air handler reads normal. Check the control sequence and setpoints, the zone loads, and the
      plant that feeds its coils.

context:
  # ---------- split systems & heat pumps (vc-core and heatpump both gate on these) ----------
  - id: hp_unit
    ask: What type of system is it?
    hint: A conventional ducted split or packaged unit, a variable-speed (inverter) ducted system, or a ductless
      mini-split / multi-zone. Inverter boards and electronic expansion valves come with the last two. Flare
      joints, wall heads, condensate pumps and branch boxes come only with the ductless one. Strip heat,
      defrost boards and O/B thermostats belong to the ducted ones.
    systems: [vc.ac, vc.hp]
    options:
      - id: ducted
        label: Conventional ducted split or packaged
        p: 0.6
        words: [ducted, air handler, strip heat, aux heat, auxiliary heat, emergency heat, sequencer, package unit,
          packaged unit, rooftop]
      - id: inverter
        label: Variable-speed (inverter) ducted
        p: 0.1
        words: [variable speed, communicating, inverter ducted]
      - id: minisplit
        label: Ductless mini-split / multi-zone (inverter)
        p: 0.3
        words: [mini split, minisplit, mini-split, ductless, wall head, cassette, multi split, multi-zone, branch box]
  - id: rv_energized
    ask: Which mode energizes the reversing-valve coil?
    hint: Meter the coil leads in cooling and in heating, or read the wiring diagram. Most US ducted splits
      energize it in cooling (thermostat terminal O). B-type units, and many ductless heads, energize it in
      heating. Go by the diagram or the meter, never by the brand name.
    systems: [vc.hp]
    options:
      - {id: cool, label: Energized in cooling (O), p: 0.8, words: [o type, o valve, energized in cooling]}
      - {id: heat, label: Energized in heating (B), p: 0.2, words: [b type, b valve, energized in heating]}

  # ---------- controls (controls.yaml gates on these) ----------
  - id: controls
    ask: What tells the equipment to run?
    hint: A room thermostat (a mechanical one has a dial and a heat anticipator; a digital one has a screen and
      runs on batteries or a C wire), a building automation (DDC) controller, or only the unit's own control
      (a box controller or a set-point dial on the unit).
    systems: ['*']
    options:
      - id: stat_mech
        label: Mechanical thermostat (dial, bimetal or mercury)
        p: 0.15
        words: [mechanical thermostat, mercury thermostat, round thermostat, bimetal thermostat, anticipator]
      - id: stat_digital
        label: Digital thermostat (batteries or C wire)
        p: 0.45
        words: [digital thermostat, programmable thermostat, smart thermostat, wifi thermostat, wi-fi thermostat,
          thermostat blank, thermostat screen, c wire]
      - id: bas
        label: Building automation / DDC controller
        p: 0.25
        words: [bas, bms, ems, ddc, building automation, front end, controls contractor, bas says, bas shows]
      - id: unit
        label: The unit's own controller only
        p: 0.15
        words: [box controller, unit controller, set point dial]
    defaults: {ahu: bas, vc.walkin: unit, vc.reachin: unit, vc.ice: unit}
  - id: rev_valve
    ask: Is it a heat pump (with a reversing valve) or cooling only?
    hint: A heat pump has a 4-way reversing valve in the outdoor unit and an O or B wire at the thermostat.
    systems: [vc.ac]
    options:
      - {id: 'yes', label: 'Heat pump (reversing valve)', p: 0.4, words: [heat pump, reversing valve, o wire, b wire]}
      - {id: 'no', label: Cooling only, p: 0.6, words: [cooling only, straight cool, ac only]}

  # ---------- refrigeration ----------
  - id: refrigerant
    kind: refrigerant
    ask: Which refrigerant?
    hint: On the nameplate or the compressor sticker.
    systems: [vc]
  - id: metering
    ask: What meters the refrigerant into the evaporator?
    hint: A TXV has a sensing bulb strapped to the suction line. A piston sits in a brass fitting at the coil
      inlet. A cap tube is a long thin tube, usually in reach-ins.
    systems: [vc]
    options:
      - {id: txv, label: TXV (expansion valve with a bulb), words: [txv, tev, expansion valve]}
      - {id: eev, label: Electronic expansion valve, words: [eev, electronic expansion valve]}
      - {id: fixed, label: Piston / fixed orifice, words: [piston, fixed orifice]}
      - {id: captube, label: Cap tube, words: [cap tube, capillary]}
  - id: receiver
    ask: Is there a receiver tank with a sight glass?
    hint: Common on walk-ins and commercial units; rare on home A/C, heat pumps and cap-tube reach-ins.
    systems: [vc]
    options: [{id: 'yes', label: 'Yes'}, {id: 'no', label: 'No'}]
    defaults: {vc.ac: 'no', vc.hp: 'no', vc.reachin: 'no', vc.walkin: 'yes'}
  - id: app
    ask: What temperature does it run at?
    systems: [vc]
    options:
      - {id: ac, label: 'Comfort A/C (coil ~40 °F)', systems: [vc.ac, vc.hp]}
      - {id: mt, label: 'Cooler / medium temp (box 33–40 °F)', systems: [vc.walkin, vc.reachin, vc.ice], words: [cooler, medium temp, produce cooler, dairy cooler, beverage cooler]}
      - {id: lt, label: 'Freezer / low temp (box below 10 °F)', systems: [vc.walkin, vc.reachin, vc.ice], words: [freezer, low temp, ice cream, frozen food]}
    defaults: {vc.ac: ac, vc.hp: ac}
  - id: sh_location
    ask: Where are you reading the suction line temperature?
    hint: Superheat targets differ. At the evaporator outlet (next to the TXV bulb) it should be small; at the
      condensing unit it is larger.
    systems: [vc]
    options:
      - {id: evap, label: At the evaporator outlet}
      - {id: comp, label: At the condensing unit / compressor}
    defaults: {vc.ac: comp}
  - id: condenser
    ask: How does the condenser reject heat?
    systems: [vc]
    options:
      - {id: air, label: Air-cooled (fan and coil)}
      - {id: water, label: Water or glycol-cooled, words: [water cooled, glycol cooled, water-cooled]}
    defaults: {vc.ac: air, vc.hp: air}
  - id: ac_eff
    ask: How efficient is the outdoor unit?
    hint: Sets the expected gap between condensing temperature and outdoor air.
    systems: [vc.ac, vc.hp]
    options:
      - {id: standard, label: 'Standard (older, 10–14 SEER)'}
      - {id: high, label: 'High efficiency (15+ SEER, big coil)'}
  - id: hpc
    ask: Does it have cold-weather head pressure control?
    hint: A flooding valve (headmaster) near the receiver, fan-cycling switches, or a variable-speed condenser fan.
      Outdoor condensers in cold places almost always do.
    systems: [vc.walkin, vc.reachin, vc.ice]
    options:
      - {id: flooding, label: Flooding valve (headmaster)}
      - {id: fan_cycling, label: Fan cycling}
      - {id: vfd, label: Variable-speed condenser fans}
      - {id: none, label: None}
  - id: defrost
    ask: How does the evaporator defrost?
    systems: [vc.walkin, vc.reachin]
    options:
      - {id: off_cycle, label: Off-cycle / air (coolers)}
      - {id: electric, label: Electric heaters}
      - {id: hot_gas, label: Hot gas}
  - id: phases
    ask: Is the compressor single-phase or three-phase?
    hint: Nameplate. One run capacitor and two power leads is single-phase; three line leads (T1 T2 T3) and no capacitor
      is three-phase.
    systems: [vc]
    options:
      - {id: single, label: Single-phase (run capacitor), p: 0.55}
      - {id: three, label: Three-phase (T1 T2 T3), p: 0.45, words: [three phase, 3 phase, 3 ph, 3ph]}

