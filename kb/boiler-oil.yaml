  # ---------------- flame proving ----------------
  - id: blr.cad_ohms
    name: CAD cell resistance
    ask: What does the CAD cell read — with the flame on, and dark?
    how: Pull the cell leads off the primary (F–F) and ohm them. Flame on, most controls want under 1,600 Ω
      (the burner maker's limit rules); dark, well over 20 kΩ. A cell that reads low in the dark sees light or is
      shorted and the control will refuse to start or lock out.
    caution: Reading it with the flame on means lifting a lead off the primary, which makes the primary shut the
      burner down — usually a lockout you caused. Reset once, and only with a dry chamber. Burner off and power
      locked out for the dark reading.
    systems: [fuel]
    requires: {flame_sensor: cad}
    cost: 2
    needs: meter
    states:
      good: Under ~1,600 Ω with flame, high dark
      high: Over ~1,600 Ω with the flame on — flame not seen
      low_dark: Low with no flame — cell sees light or is shorted
    normal: good
    phrases:
      high: [cad cell high, cad cell reads high, cad cell bad, cad cell dirty, bad cad cell, cadmium cell, flame not
        proven, not proving flame, eye dirty, sooty cad cell, cad cell 5000 ohms, high ohms with flame, cad cell not
        seeing flame, flame sensor bad]
      low_dark: [cad cell sees light, cad cell low in the dark, cad cell shorted, light leak, cell reads low with no
        flame, control sees flame before start, false flame]
      good: [cad cell ok, cad cell good, cad cell reads low with flame, flame proven]
  - id: blr.stack_relay
    name: Stack relay
    ask: Does the stack relay's helix move freely and do its contacts switch cleanly when the stack heats?
    how: Pull the relay out of the smoke pipe. Soot binds the bimetal helix so the hot contacts never make or never
      break; worn contacts drop the burner.
    caution: Burner off and the smoke pipe cool before the relay comes out, and reseal the hole before any restart —
      an open hole upsets the draft and can spill flue gas into the room. After a stack-control lockout let its
      safety element cool before you reset, and never hold the relay in (TM 5-642 ¶3-11b(7), ¶7-9h).
    systems: [fuel]
    requires: {flame_sensor: stack}
    cost: 3
    states:
      ok: Helix free, contacts clean
      faulty: Helix sooted or stuck, contacts worn or dirty
    normal: ok
    phrases:
      faulty: [stack relay bad, stack switch bad, stack relay stuck, helix stuck, helix sooted, protectorelay, stack
        control bad, bimetal stuck, stack switch wont reset, hot contacts, cold contacts]

