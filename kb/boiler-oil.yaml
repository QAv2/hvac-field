module: boiler-oil
title: Oil-fired heating — pressure-gun burners, boilers (hot water and steam) and warm-air furnaces
notes: |
  Burner, control and steam-side directions follow US Army TM 5-642 (1990) where it speaks: the oil-burner
  troubleshooting list (¶3-13d), ignition and draft procedure (¶3-11), combustion safeguards and low-water
  cutoffs (¶7-13), limit controls (¶7-11, ¶6-39), warm-air troubleshooting (¶6-40), water-level and steam
  difficulties (¶4-77 to 4-87) and feeder/cutoff testing (¶4-35). TM 5-642 predates CAD-cell detail and gives
  no smoke-spot, CAD-cell or pump-vacuum limits, so those thresholds are general field practice (cited
  `practice`) and are said so in `notes`. Everything is in our own words.
  Combustion numbers: TM 5-642 wants ≈10 % CO2 after adjustment and treats a burner that cannot reach 5 % O2
  without smoke as a replacement candidate; flame-retention burners today are tuned to 11–12.5 % CO2
  (4–5.5 % O2) with a smoke spot of 1 or less. The `blr.o2` window (3–8 %) covers both. Stack temperature: TM
  5-642 ¶7-9f says most furnaces and boilers run 400–600 °F stack; we flag net stack over 600 °F (fouled or
  overfired) and under 275 °F (condensing, flue corrosion).
  Draft: TM 5-642 quotes draft unsigned — set it to 0.02–0.04 in. w.c. to start (¶3-11b(1)) and says starting
  conditions need about 0.03–0.06 in the firebox (¶3-13f). In this module draft is typed as a NEGATIVE number (a
  plus sign means pressure over the fire); practice for a flame-retention burner is about −0.02 in. w.c. over the
  fire and −0.04 to −0.06 at the breech.
  Fuel in the cold: No. 2 oil clouds around +10 to +20 °F untreated and gels a few degrees lower. Kerosene /
  No. 1 / JP-8 / AN8 / arctic diesel stay fluid to about −40 °F, but below that, in outdoor tanks and lines, they
  can cloud too (check the lot's cloud or freeze point). So waxing is a live cause on every grade: on No. 2 it
  needs cold weather, on the kerosene-class fuels it needs deep cold plus hard evidence (cloudy sample, waxed
  filter), and `fuel_type` sets how strict the engine is. Water and ice in the fuel, an iced tank vent and
  plain thick fuel apply to every grade.
  Rules this module repeats on purpose wherever they bite: reset a locked-out primary once, then find the cause
  before another reset (TM 5-642 ¶7-9l); liquid oil out of the chamber and the vapor cleared before any relight
  (¶3-11b(9) describes letting oil-soaked soft brick burn off with the relief door open; a small gun-fired unit has
  no relief door, so do not copy that); never jumper a limit, pressuretrol or low-water cutoff to test or to get
  heat; never spray oil with the igniter live.

context:
  - id: fuel_type
    ask: What fuel does it burn?
    hint: No. 2 heating oil and No. 2 diesel wax up in the cold (around +10 to +20 °F). Kerosene, No. 1, JP-8, AN8
      and arctic diesel stay fluid to about −40 °F, but below that, in outdoor tanks and lines, they can cloud
      too — check the lot's cloud point.
    systems: [fuel]
    options:
      - {id: no2, label: 'No. 2 heating oil / No. 2 diesel', words: [heating oil, red diesel, no 2 oil, no 2 diesel,
          no 2 fuel oil, number 2 oil, number 2 diesel]}
      - {id: kero, label: 'Kerosene, No. 1, JP-8 / AN8, arctic diesel', words: [jp8, jp 8, an8, an 8, kerosene, kero,
          arctic diesel, jet fuel, no 1 oil, no 1 fuel oil]}
    # no default on purpose: the plant burns both families, so the question is always put to the tech
  - id: oil_piping
    ask: How is the fuel unit piped?
    hint: One-pipe has no return line (return port plugged, bypass plug out). Two-pipe has a return line and the
      bypass plug in. A two-stage pump has two gear sets.
    systems: [fuel]
    options:
      - {id: one_pipe, label: One-pipe (no return line)}
      - {id: two_pipe, label: 'Two-pipe, single-stage pump'}
      - {id: two_stage, label: 'Two-pipe, two-stage pump'}
    defaults: {fuel.boiler: two_pipe, fuel.furnace: two_pipe}
  - id: flame_sensor
    ask: How does the primary control prove the flame?
    hint: A CAD cell is the little photocell under the ignition transformer, looking down the air tube. A stack
      relay is a box clamped on the smoke pipe with a bimetal helix inside (older installations).
    systems: [fuel]
    options:
      - {id: cad, label: CAD cell (photocell in the burner)}
      - {id: stack, label: Stack relay / stack switch on the smoke pipe}
    defaults: {fuel.boiler: cad, fuel.furnace: cad}
  - id: boiler_kind
    ask: Hot-water or steam boiler?
    hint: Steam boilers have a gauge glass and a pressuretrol; hot-water boilers have an aquastat, an expansion
      tank and a pressure/temperature gauge.
    systems: [fuel.boiler]
    options:
      - {id: hw, label: Hot water (hydronic)}
      - {id: steam, label: Steam}
    defaults: {fuel.boiler: hw}

features:
  # ---------------- the complaint and the first look ----------------
  - id: blr.lockout
    name: Lockout
    ask: Is the primary control locking out (red light, reset button)?
    how: Reset ONCE and watch one start, and keep count of the resets. A lockout that comes back has just pumped
      oil for the full safety time, so find what is stopping the flame before you reset again — no restart until
      the cause is known (TM 5-642 ¶7-9l).
    caution: Reset once only, and keep count. Every failed try sprays oil for the full safety time. Before any
      further reset, look into the chamber with the burner off — liquid oil, or a glowing or smoldering floor, means
      no relight until the oil is removed, the chamber has cooled and the vapor has cleared.
    systems: [fuel]
    complaint: true
    chip: state
    cost: 1
    states:
      'no': No lockout
      once: Locked out once or now and then — ran again after one reset
      repeats: Locks out again on every try or within minutes
    normal: 'no'
    base: {'no': 0.84, once: 0.08, repeats: 0.08}
    phrases:
      once: [lockout, locked out, locks out sometimes, nuisance lockout, reset button, hit the reset, red light,
        reset and it runs, locks out at night, locks out once in a while, safety tripped, tripped the safety]
      repeats: [keeps locking out, locks out every time, locks out again, lockout repeats, wont stay running,
        won't stay running, locks out right away, locks out after 15 seconds, locks out in 15 seconds, hard lockout,
        reset doesnt help, reset doesn't help, three tries and lockout]
  - id: blr.start
    ask_unless: {blr.lockout: repeats, blr.co_room: 'yes'}
    name: Burner on a call
    ask: Watch one start — what does the burner do on a call for heat?
    how: Turn the thermostat up or jumper T–T at the primary control and watch through the inspection port. Watch
      one start, not several. With a CO complaint, do not cycle the burner until the flue and vent are proven clear.
    caution: One start only. If it fails to light and locks out, do not keep resetting — look into the chamber with
      the burner off for liquid oil and find the cause first. Stand to the side of the inspection port, and with a
      CO complaint keep the burner off until the flue and vent are proven clear.
    systems: [fuel]
    complaint: true
    chip: state
    cost: 1
    states:
      normal: Lights within a few seconds and runs steady
      nothing: Nothing happens on a call — the burner motor never runs
      no_flame: Motor runs but no flame — then locks out
      flame_lost: Lights, then the flame drops out or it locks out later
      delayed: Lights late — a puff, bang or rumble at light-off
    normal: normal
    phrases:
      nothing: [burner wont start, burner won't start, burner does nothing, motor doesnt run, motor doesn't run,
        nothing happens, no burner, burner dead, burner not coming on, no response to thermostat]
      no_flame: [no flame, no fire, wont light, won't light, no ignition, not lighting, motor runs no flame,
        runs but no fire, burner runs but doesnt light, cranks but no flame, fails to light, no light off]
      flame_lost: [flame goes out, lights then goes out, fire goes out, flame drops out, lights and dies,
        runs a minute then locks out, flame failure, loses flame, flame out, cuts out after it lights,
        locks out while running]
      delayed: [delayed ignition, puff back, puffback, puff-back, bang on start, bangs when it lights, boom on
        startup, rumbles on start, hard start, late ignition, explodes on start, kicks on start, smoke on start]
      normal: [lights fine, burner runs, fires ok, flame ok]
  - id: blr.flame_look
    ask_unless: {blr.lockout: repeats, blr.co_room: 'yes'}
    name: Flame appearance
    ask: With the burner running, what does the flame look like through the inspection port?
    how: Wait a minute after light-off. A good gun-burner flame is bright yellow-orange with a defined shape, steady,
      and clear of the chamber walls.
    caution: Look from the side, not straight into the port, and keep the port closed except to look. After a puff,
      bang or misfire, shut the burner off and check the chamber for liquid oil before you try another start.
    systems: [fuel]
    cost: 2
    states:
      normal: Bright yellow-orange, steady, clear of the chamber walls
      smoky: Dark orange, lazy, smoky tips
      stringy: Sparky, stringy or one-sided — streaks of raw oil
      pulsing: Pulsates, rumbles or surges
      impinging: Hits the chamber wall or floor — bright spot, carbon on the brick
    normal: normal
    phrases:
      smoky: [smoky flame, smokey flame, dark flame, lazy flame, orange smoky fire, dirty flame, sooty flame,
        flame smoking]
      stringy: [stringy flame, sparky flame, sparklers, sparks in the flame, raw flame, one sided flame, lopsided
        flame, streaky flame, uneven flame, flame off to one side, flame flutters]
      pulsing: [pulsating flame, flame pulsates, rumbling, rumbles, burner rumbles, surging flame, flame surges,
        pulsation, thumping fire, breathing flame, fire pulses]
      impinging: [flame hitting the wall, flame impingement, impingement, flame too long, flame on the floor,
        flame hits the chamber, carbon on the chamber, flame too big for the chamber]
  - id: blr.after_drip
    name: After-drip
    ask: When the burner shuts off, does the flame hang on, smoke, rumble or drip oil (after-drip)?
    systems: [fuel]
    chip: state
    cost: 2
    states:
      'no': Shuts off clean
      'yes': After-drip — flame hangs on, smokes or drips at shutdown
    normal: 'no'
    phrases:
      'yes': [after drip, afterdrip, after-drip, drips after shutdown, nozzle dripping, smokes on shutdown, flame
        hangs on, rumbles on shutdown, oil drips from nozzle, dribbles at shutoff, smoke at shutdown]
  - id: blr.oil_smell
    name: Oil smell
    ask: Is there a fuel-oil or kerosene smell around the unit or in the building?
    systems: [fuel]
    complaint: true
    chip: state
    cost: 1
    states:
      'no': No oil smell
      'yes': Oil / kerosene smell
    normal: 'no'
    phrases:
      'yes': [oil smell, smells like oil, fuel smell, fuel oil smell, kerosene smell, diesel smell, jet fuel smell,
        smells like diesel, oil odor, oily smell in the house, fumes, smells like fuel]
  - id: blr.soot_outside
    name: Soot or smoke outside the appliance
    ask: Is soot or smoke getting out of the appliance — on the jacket, at the draft regulator, in the room?
    systems: [fuel]
    complaint: true
    chip: state
    cost: 1
    states:
      'no': None
      'yes': Soot or smoke outside the appliance
    normal: 'no'
    phrases:
      'yes': [soot, soot in the house, soot everywhere, soot on the burner, soot around the boiler, smoke in the
        boiler room, smoke in the house, smoking, black soot, smoke from the barometric, smoke out the draft regulator,
        smoke out the inspection door, sooty, black dust, soot on the walls, puffback soot]
  - id: blr.pump_noise
    name: Fuel pump noise
    ask: Is the fuel pump noisy — whine, growl or chatter?
    systems: [fuel]
    cost: 1
    states:
      quiet: Quiet
      noisy: Whines, growls or chatters
    normal: quiet
    phrases:
      noisy: [pump noisy, noisy pump, pump whining, pump whine, pump growls, pump chatters, pump screams, loud pump,
        pump howls, fuel unit noisy, burner whining]
  - id: blr.oil_leak
    name: Oil leak
    ask: Is oil leaking anywhere — pump shaft, filter, fittings, nozzle line, under the burner?
    caution: Oil on a hot burner housing or in the chamber is a fire hazard. Close the oil supply valve at the tank
      and kill burner power before you touch anything.
    systems: [fuel]
    complaint: true
    chip: state
    cost: 1
    states:
      'no': Dry
      'yes': Oil leaking
    normal: 'no'
    phrases:
      'yes': [oil leak, leaking oil, oil on the floor, oil under the burner, pump leaking, shaft seal leaking, oil
        dripping, wet with oil, fuel leak, filter leaking, oil puddle, oil at the fitting]
  - id: blr.co_room
    name: CO in the building
    ask: Has a CO alarm gone off or has CO been measured in the building or the supply air?
    caution: If CO is confirmed, ventilate and shut the burner off before you troubleshoot. Do not cycle the burner
      until the flue and vent are proven clear.
    systems: [fuel]
    complaint: true
    chip: state
    cost: 1
    states:
      'no': No CO alarm or reading
      'yes': CO alarm or CO measured in the building
    normal: 'no'
    base: {'no': 0.95, 'yes': 0.05}
    phrases:
      'yes': [co alarm, carbon monoxide, co detector, co detector going off, co alarm going off, co in the house,
        co in the ducts, co in supply air, headaches, people getting sick, fumes in the building, carbon monoxide
        alarm]

  # ---------------- no start: the electrical chain ----------------
  - id: blr.motor
    name: Burner motor
    ask: With voltage at the motor, what does the burner motor do — and does the shaft turn freely by hand?
    how: Power off to spin it. Try the motor shaft or fan wheel by hand with the coupling on, then with it off; a
      seized pump binds the shaft only while coupled.
    caution: Power off and locked out before you turn the shaft, coupling or fan wheel by hand.
    systems: [fuel]
    ask_if: {blr.start: nothing}
    cost: 2
    states:
      runs: Runs
      hums_bound: Hums or trips its overload — shaft hard to turn (seized pump or motor bearings)
      hums_free: Hums or trips — shaft turns freely (start winding, capacitor or overload)
      silent: Voltage present, silent — open winding or open thermal protector
    normal: runs
    phrases:
      hums_bound: [motor hums, burner motor hums, motor locked up, pump seized, seized pump, motor wont turn, motor
        won't turn, shaft wont turn, shaft stuck, motor trips, motor overload trips, motor smells hot]
      hums_free: [motor hums shaft spins, motor buzzes, hums then trips, motor tries to start, motor needs a push,
        bad motor capacitor]
      silent: [motor dead, burner motor dead, motor silent, motor does nothing with power, open winding, motor
        burnt out]
  - id: blr.motor_v
    name: Voltage to the burner motor
    ask: Does the primary control put line voltage out to the burner motor on a call?
    how: Meter the motor leads (orange/black on most primaries to white) with the thermostat calling and the control
      reset.
    systems: [fuel]
    ask_if: {blr.start: nothing}
    cost: 2
    needs: meter
    states:
      present: Present
      missing: Missing
    normal: present
    phrases:
      missing: [no voltage to motor, no power to the burner motor, no output from primary, primary not sending
        power, no voltage on orange, nothing to the motor]
      present: [voltage at motor, power to the motor, motor has voltage]
  - id: blr.primary_line_in
    name: Line voltage into the primary control
    ask: Is there line voltage into the primary control (through the limit and safety string)?
    how: Meter the primary's hot-in (black) to white. Missing here with power at the service switch means a limit,
      LWCO or other safety is open — check each one.
    systems: [fuel]
    ask_if: {blr.start: nothing}
    # power at the unit reaches the primary unless a limit is open: a cause silent here reads its gen.power sign
    follows: {gen.power: {present: [present], missing: [missing]}}
    cost: 2
    needs: meter
    states:
      present: Present
      missing: Missing — a limit or safety ahead of it is open
    normal: present
    phrases:
      missing: [no power to primary, no voltage to the primary control, no line in, no power through the limit,
        primary control dead, nothing to the control]
  - id: blr.tt
    ask_unless: {blr.lockout: repeats, blr.co_room: 'yes'}
    name: Call at the primary (T–T)
    ask: Is the call for heat reaching the primary control — T–T closed, or the burner starts when you jumper T–T?
    how: Jumper T to T at the primary for a few seconds only, then take the jumper off. If the burner starts, the
      thermostat, zone relay, end switch or interlock upstream is the problem; if not, the primary or its power is.
    caution: On a boiler, confirm the circulator is running before you jumper T–T — a zone valve or flow interlock
      may be open to keep the boiler from firing with no flow. Jumper for a few seconds, watch one start, and take
      the jumper off; if it fails to light, do not keep resetting.
    systems: [fuel]
    ask_if: {blr.start: nothing}
    # the call at T–T is the thermostat's call arriving: a cause silent here reads its gen.call sign
    follows: {gen.call: {'yes': [calling], 'no': [not_calling]}}
    cost: 2
    needs: meter
    states:
      'yes': Call present at T–T
      'no': No call at T–T (runs when T–T is jumpered)
    normal: 'yes'
    phrases:
      'no': [no call at tt, no tt, jumper tt and it runs, runs when jumpered, no call to the primary, end switch not
        made, zone valve end switch, relay not calling, t-t open]
  - id: blr.polarity
    name: Polarity at the burner
    ask: Is hot/neutral polarity correct at the primary control (hot on black, neutral on white, ground good)?
    how: Meter black to ground (should read line voltage) and white to ground (should read near zero). Modern
      primaries are polarity-sensitive and misbehave or lock out when reversed.
    systems: [fuel]
    cost: 2
    needs: meter
    states:
      ok: Correct
      reversed: Reversed, or neutral/ground open
    normal: ok
    base: {ok: 0.95, reversed: 0.05}
    phrases:
      reversed: [reversed polarity, polarity reversed, hot and neutral swapped, wired backwards, neutral hot, bad
        ground at the burner, no ground, floating neutral, generator wiring]

  # ---------------- ignition parts (drawer assembly out) ----------------
  - id: blr.spark
    name: Ignition spark
    ask: Does the ignition transformer / igniter throw a strong arc across the electrode tips?
    how: Take the oil away first — oil supply valve closed at the tank, the oil solenoid unplugged if there is one,
      and, if the primary allows it, the motor leads lifted so the pump does not turn. Oil still in the pump and
      line can reach the nozzle in the first seconds, so wipe the drawer assembly dry. Then, with the assembly out,
      start the burner for a moment only and watch the gap. Use an igniter tester or the burner maker's method on
      solid-state igniters — don't arc them by hand.
    caution: Oil off before the igniter is live — supply valve closed, solenoid unplugged, and the pump not turning
      if you can lift the motor leads. An arc beside a spraying nozzle is a fire. There are 10,000 V or more at the
      electrodes, so keep hands clear, and never arc a solid-state igniter by hand.
    systems: [fuel]
    ask_if: {blr.start: [no_flame, delayed, flame_lost]}
    cost: 3
    needs: shutdown
    states:
      strong: Strong, steady arc
      weak: Weak, thin or intermittent arc
      none: No arc
    normal: strong
    phrases:
      none: [no spark, no arc, transformer dead, igniter dead, ignitor dead, no ignition spark, bad transformer,
        ignition transformer bad, no high voltage]
      weak: [weak spark, weak arc, thin spark, intermittent spark, spark comes and goes, weak transformer, weak
        igniter, weak ignitor]
      strong: [good spark, strong spark, spark ok, transformer ok]
  - id: blr.electrodes
    name: Electrodes
    ask: How do the electrodes look — gap and position to the burner's spec card, porcelain intact, tips clean?
    how: Typical settings are a 1/8–5/32 in. gap with the tips just ahead of and above the nozzle, out of the spray.
      Look for cracked or carbon-tracked porcelain, burnt tips, carbon bridging, loose clamps.
    systems: [fuel]
    cost: 3
    needs: shutdown
    states:
      ok: Set to spec, porcelain clean and intact
      off_spec: Gap or position off spec, tips worn back
      damaged: Cracked or carbon-tracked porcelain, carboned or bridged tips
    normal: ok
    phrases:
      off_spec: [electrodes out of adjustment, electrode gap wrong, electrodes too far apart, electrodes in the
        spray, electrodes misadjusted, electrode setting, tips burnt back, electrodes worn]
      damaged: [cracked porcelain, cracked insulator, carbon on the electrodes, electrodes carboned, electrodes
        sooted, carbon tracking, electrode bridged, insulator cracked, burnt electrodes]
  - id: blr.nozzle
    name: Nozzle
    ask: What does the nozzle look like, and does it match the rating plate (gph at rated pressure, angle, pattern)?
    how: Pull it with a nozzle wrench. Check the stamping against the appliance plate and the burner's spec. Replace,
      don't clean in the field; never put a metal needle in the orifice (TM 5-642 ¶3-13b).
    systems: [fuel]
    cost: 3
    needs: shutdown
    states:
      ok: Clean, correct size, angle and pattern
      plugged: Plugged or dirty — carbon or sludge on the face, strainer loaded
      worn: Worn or eroded orifice, bad spray pattern
      wrong: Wrong size, angle or pattern for the appliance
    normal: ok
    phrases:
      plugged: [plugged nozzle, clogged nozzle, dirty nozzle, nozzle plugged, nozzle clogged, carbon on nozzle,
        carboned nozzle, nozzle strainer plugged, bad nozzle, nozzle partly plugged]
      worn: [worn nozzle, old nozzle, nozzle worn out, eroded nozzle, bad spray pattern, nozzle spraying crooked,
        nozzle streaming]
      wrong: [wrong nozzle, oversized nozzle, nozzle too big, nozzle too small, wrong spray angle, wrong angle nozzle,
        wrong pattern, overfired, over fired, underfired, under fired, nozzle doesnt match plate]
  - id: blr.coupling
    name: Motor-to-pump coupling
    ask: Is the coupling between the motor and the fuel pump intact and driving the pump?
    systems: [fuel]
    cost: 3
    needs: shutdown
    states:
      ok: Intact, drives the pump
      broken: Broken, stripped, slipping or missing
    normal: ok
    phrases:
      broken: [broken coupling, coupling broken, coupling stripped, coupling slipping, sheared coupling, pump not
        turning, pump shaft not turning, pump doesnt spin, pump doesn't spin, coupling missing]
  - id: blr.chamber
    name: Combustion chamber
    ask: How does the combustion chamber / refractory look through the port?
    how: Burner off first. Look for liquid oil on the floor, carbon, cracks or a collapsed liner, and for a floor
      that is glowing or smoldering.
    caution: Burner off and the chamber cool before the port or door is opened; stand to the side. Liquid oil, or a
      glowing or smoldering floor, means no relight — remove the oil, let it cool and let the vapor clear first.
    systems: [fuel]
    cost: 3
    needs: shutdown
    states:
      ok: Sound and clean
      carbon_oil: Carbon buildup or oil-soaked floor
      damaged: Cracked, collapsed or burned-through refractory
    normal: ok
    phrases:
      carbon_oil: [carbon in the chamber, oil in the chamber, oil soaked chamber, raw oil in the firebox, puddle of
        oil in the chamber, carbon buildup, clinkers, coke in the chamber, chamber full of carbon]
      damaged: [cracked chamber, chamber cracked, refractory cracked, refractory collapsed, chamber fell apart,
        burned through chamber, broken fire brick, chamber liner gone, bad chamber]

  # ---------------- fuel supply ----------------
  - id: blr.tank
    name: Fuel supply at the tank
    ask: Is there fuel in the tank and is the supply valve (and fusible-link fire valve) open?
    how: Stick the tank or check the gauge against a stick — gauges stick. The spring-loaded fire valve above the
      burner closes when its fusible link lets go; look for a tripped lever.
    caution: A tripped fire valve means its fusible link let go — look for fire or a heat source at the burner before
      you reset it, and don't reset it with oil leaking.
    systems: [fuel]
    cost: 1
    states:
      ok: Fuel present, valves open
      empty: Tank empty or below the pickup
      valve_closed: Supply valve or fire valve closed
    normal: ok
    phrases:
      empty: [out of oil, out of fuel, ran out of oil, ran out of fuel, tank empty, no oil in tank, empty tank, low
        tank, gauge stuck, tank gauge wrong, no fuel, fuel delivery late, ran dry]
      valve_closed: [valve closed, fuel valve closed, oil valve shut, firomatic tripped, fire valve closed, fusible
        link valve tripped, someone shut the valve, supply valve off]
  - id: blr.tank_vent
    name: Tank vent
    ask: Is the tank vent open — does air move at the vent cap, and does the pump vacuum fall when the vent is cleared?
    how: Look at the vent cap for rime, ice, snow or a screen packed with frost. A vent whistle that has gone silent,
      or air rushing in when you crack the fill cap, means the vent is plugged and the tank is pulling a vacuum.
    caution: No flame, torch or heat gun at a tank vent — there is fuel vapor there. Thaw a frozen vent with warm
      water or warm rags.
    systems: [fuel]
    cost: 1
    states:
      open: Open — air moves freely
      blocked: Blocked — frost, ice, snow or a pinched vent line
    normal: open
    phrases:
      blocked: [vent iced, vent iced over, tank vent frozen, vent frozen shut, vent plugged, vent blocked, vent cap
        iced, vent cap frozen, rime on the vent, frost on the vent cap, tank sucks air, air rushes in at the fill
        cap, vent whistle silent, tank vent pinched, tank vent blocked, vent line crushed]
  - id: blr.filter
    name: Fuel filter / strainer
    ask: What's in the fuel filter and the pump strainer?
    caution: Oil supply valve closed before a filter or strainer is opened. Catch the oil and wipe up every spill
      before the burner runs again.
    systems: [fuel]
    cost: 3
    needs: shutdown
    states:
      clean: Clean
      clogged: Clogged with sludge, rust or dirt
      waxed_iced: Coated with wax, slush or ice
    normal: clean
    phrases:
      clogged: [clogged filter, plugged filter, dirty fuel filter, fuel filter dirty, filter full of sludge, sludge,
        rust in the filter, strainer plugged, pump strainer dirty, filter plugged, black filter]
      waxed_iced: [wax in the filter, waxed filter, waxy filter, filter gelled, slush in the filter, ice in the filter,
        frozen filter, filter froze, white wax, jelly in the filter, gel in the filter]
  - id: blr.fuel_sample
    name: Fuel sample
    ask: What does a fuel sample from the filter bowl or tank bottom look like?
    how: Drain a little into a clear jar and let it settle. Water sits on the bottom as a clear layer or shows as
      ice crystals; waxed fuel is cloudy or jelled; bad fuel is dark with sediment or stringy growth.
    systems: [fuel]
    cost: 2
    states:
      clear: Clear and bright
      water_ice: Free water or ice crystals
      cloudy_wax: Cloudy, waxy or jelled
      dark_sludge: Dark, sediment or microbial growth
    normal: clear
    phrases:
      water_ice: [water in the fuel, water in the tank, water in the oil, ice in the fuel, ice crystals, slush in the
        fuel, water bottom, condensation in the tank, snow in the tank, water in the filter bowl]
      cloudy_wax: [cloudy fuel, waxy fuel, gelled fuel, jelled fuel, fuel gelled, fuel jelled, fuel waxed, diesel
