    ask: What is the draft over the fire (through the inspection port) with the burner running warm?
    how: Type draft as a NEGATIVE number — a gauge that says "draft 0.04" is −0.04 here, and a plus sign means pressure.
      A flame-retention burner usually wants about −0.02 in. w.c.; TM 5-642 wants the firebox just below atmospheric
      once warm so nothing pushes out, and says starting conditions need about 0.03–0.06 (¶3-13f), so judge against
      the burner's own spec.
