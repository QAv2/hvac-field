      dark_sludge: [sludge in the tank, dirty fuel, bad fuel, black fuel, algae in the fuel, microbes, bugs in the
        fuel, sediment in the fuel, old fuel]
  - id: blr.pump_psi
    name: Pump pressure
    ask: What does a gauge on the pump's pressure port read with the burner running?
    how: Gauge in the gauge port or nozzle port. Most pumps are set at 100 psi; many newer burners run 140–150 —
      check the burner's spec. The needle should be steady, and drop sharply to a held cutoff pressure at shutdown.
      Pressure that comes up to spec on a start and holds at cutoff also proves oil is leaving the pump.
    caution: Fit the gauge with the burner off and the oil supply valve closed, and check it for leaks before the
      burner runs. Oil leaves a loose gauge or bleed port at pump pressure (100 psi or more) and can go through skin.
      Read the needle at the start; if it will not light, shut down — no repeated tries.
    systems: [fuel]
    cost: 3
    needs: gauges
    states:
      normal: At spec (within about 10 psi) and steady
      low: Low — more than about 10 psi below spec
      zero: Zero — no pressure
      high: High — more than about 10 psi above spec
      fluctuating: Needle bounces or wanders
    normal: normal
    phrases:
      low: [low pump pressure, pump pressure low, pressure low, 60 psi, wont make pressure, won't make pressure, low
        oil pressure, pressure below 100]
      zero: [no pump pressure, zero pressure, no oil pressure, pump not pumping, pump dead, no pressure at the gauge]
      high: [pump pressure high, pressure too high, pressure set high, 150 psi on a 100 psi nozzle, regulator set
        high, overpressure]
      fluctuating: [pressure bouncing, needle bouncing, pressure fluctuates, pressure hunting, pressure jumps,
        gauge flickers, erratic pressure]
  - id: blr.pump_vac
    name: Pump vacuum
    ask: What does a vacuum gauge on the pump inlet read with the burner running?
    how: Expect roughly 1 in. Hg per foot of lift plus 1 per 10 ft of horizontal run. How much a pump may pull depends
      on its piping — about 6 in. Hg on a one-pipe system (above that, air comes out of the oil), about 10 on a
      two-pipe single-stage pump, about 15 on a two-stage; the pump's data sheet rules. Over its limit is a
      restriction (filter, valve, kinked or frozen line, iced tank vent, thick or gelled fuel), and so is a reading
      well above what the lift explains. Near zero with real lift means air is getting in. On shutdown the needle
      should hold — a steady fall is a suction-side air leak.
    caution: With the tank above the burner, close the oil supply valve before the vacuum-gauge plug comes out, or oil
      runs out of the port. Wipe up before the burner runs.
    systems: [fuel]
    cost: 3
    needs: gauges
    states:
      normal: Normal for the lift, holds on shutdown
      high: High — over the pump's limit (about 6 in. Hg one-pipe, 10 two-pipe single-stage, 15 two-stage) or well
        above what the lift explains
      low_zero: Near zero with real lift, or won't hold on shutdown
    normal: normal
    phrases:
      high: [high vacuum, vacuum high, pulling high vacuum, 15 inches vacuum, vacuum too high, pump starving, hard
        pull on the line]
      low_zero: [no vacuum, zero vacuum, vacuum leaks down, wont hold vacuum, won't hold vacuum, vacuum drops when it
        shuts off, sucking air, air in the line, air in the oil line, bleeding air every start]
  - id: blr.oil_at_nozzle
    name: Oil reaching the nozzle
    ask: With ignition off and the motor running, does oil leave the pump and get as far as the nozzle line?
    how: Prove delivery at the pump first, with ignition off (lift the igniter or transformer lead) so nothing can
      light. Put the gauge with its bleeder in the pump's gauge port, run a hose from the bleeder into a container,
      put on safety glasses, open the bleeder, and run the motor for a few seconds. A solid, air-free stream means
      oil is leaving the pump. Shut the burner off at the service switch before you close the bleeder — closing it
      with the motor running pressures the pump up and sprays the nozzle with the igniter off. Pressure that comes up
      to spec on a normal start and holds at cutoff (see the pump pressure check) proves the same thing, and an oil
      valve that clicks open on a powered coil lets the oil through to the nozzle line. Only if the nozzle line itself
      is still in doubt, make sure ignition is off, take the line off at the nozzle end so any oil valve is tested
      too, clamp the open end into a container so it cannot whip, and run the motor once for a few seconds. A solid
      stream means the pump and supply are fine and the fault is at the nozzle or ignition. Never run the burner with
      the drawer assembly out or the nozzle line open to the room — the nozzle sprays at pump pressure and the
      igniter is a spark in the middle of it.
    caution: Ignition OFF before the motor runs — lift the igniter or transformer lead. Safety glasses on, a container
      under any open line or port, hands clear; oil leaves at pump pressure (100 psi or more) and can go through skin.
      Burner off before you close the bleeder. Never run the burner with the drawer assembly out or the nozzle line
      open to the room.
    systems: [fuel]
    ask_if: {blr.start: [no_flame, flame_lost]}
    cost: 4
    needs: shutdown
    states:
      'yes': Oil flows
      'no': No oil, or only a dribble
    normal: 'yes'
    phrases:
      'no': [no oil at the nozzle, no oil to the nozzle, not getting oil, no fuel to the burner, no oil to the burner,
        oil not reaching the burner, nozzle dry, no fuel at the nozzle, dry nozzle line]
      'yes': [oil at the nozzle, getting oil, oil flows, fuel reaches the nozzle]
  - id: blr.oil_valve
    ask_unless: {blr.lockout: repeats, blr.co_room: 'yes'}
    name: Oil solenoid / delay valve
    ask: Does the oil valve get voltage and open on a start (click), and does it hold tight at shutdown?
    how: Meter the coil on a start. The delay valve opens a few seconds after the motor (TM 5-642 ¶3-14b says at
      least 4 s) and must shut instantly when the motor stops.
    caution: This needs a start — one try only. If it will not light and the primary locks out, stop, look into the
      chamber for liquid oil, and find the cause before any further reset.
    systems: [fuel]
    cost: 2
    needs: meter
    states:
      ok: Powered, opens and closes clean
      no_power: No voltage to the coil on a start
      stuck: Powered but doesn't open (dead coil, stuck plunger)
      leaks: Passes oil after shutdown
    normal: ok
    base: {ok: 0.9, no_power: 0.03, stuck: 0.04, leaks: 0.03}
    phrases:
      no_power: [no voltage to the oil valve, solenoid not getting power, valve not energized]
      stuck: [oil valve stuck, solenoid stuck, solenoid dead, oil valve not opening, solenoid valve bad, delay valve
        stuck, valve wont open, oil solenoid failed]
      leaks: [solenoid leaking through, oil valve leaks, valve passes oil, solenoid dribbles]
  - id: blr.bypass_plug
    name: Pump bypass plug vs piping
    ask: Does the pump's bypass plug match the piping — plug IN for two-pipe, OUT for one-pipe?
    how: Pull the return-port plug on the pump and look for the small bypass plug inside. A plug on a one-pipe system
      dead-heads the pump and blows the shaft seal; no plug on a two-pipe system means it never primes properly.
    caution: Burner off and the oil supply valve closed first; catch the oil that runs out of the return port.
    systems: [fuel]
    ask_if: {gen.recent_work: 'yes'}
    cost: 3
    needs: shutdown
    states:
      ok: Matches the piping
      wrong: Wrong for the piping
    normal: ok
    phrases:
      wrong: [bypass plug, by-pass plug, bypass plug installed one pipe, no bypass plug two pipe, one pipe two pipe,
        return port plugged, new pump leaking, new pump wont prime, pump wont prime, won't prime, wrong pump setup]

