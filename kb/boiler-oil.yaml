  - id: blr.lwco
    name: Low-water cutoff
    ask: Is the low-water cutoff open or closed — and is the water really low?
    how: Meter across the LWCO contacts; then check the gauge glass (steam) or confirm the boiler is full (hot water).
      Open with the water low is the cutoff doing its job. Open with water visible at the right level means a dirty
      probe, a sludged float chamber or a bad control. Closed with the water below the cutoff level and the burner
      still firing means the cutoff has failed (stuck, bridged, jumpered or not fitted) — shut the burner off first.
    caution: Never jumper the cutoff, to test it or to get heat. If the water is low or out of sight, shut the burner
      off first and do not feed water into a hot boiler (TM 5-642 ¶4-78).
