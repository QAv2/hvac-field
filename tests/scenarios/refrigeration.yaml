- name: Reach-in cooler holding 36 °F, but water puddling on kitchen floor from overflowing bottom evaporation pan
  system: vc.reachin
  ctx: {app: mt}
  findings: {gen.output: normal, gen.water_leak: 'yes', rf.evap_pan_wick: overflowing_dead}
  inputs: {rf.box_f: 36, rf.setpoint_f: 36}
  expect:
    top: rf.reachin_wick_pan_overflow
    measured: {rf.box_temp: normal}

- name: Sandwich prep table warm and coil icing — food pans missing from top rail and hood left open
  system: vc.reachin
  ctx: {app: mt}
  findings: {gen.output: weak, gen.runs_constantly: 'yes', vc.evap_frost: heavy, rf.prep_rail: open_blocked}
  inputs: {rf.box_f: 48, rf.setpoint_f: 36}
  expect:
    top: rf.prep_table_rail_open
    measured: {rf.box_temp: high}

# ======================= ice machine: water, freeze & harvest =======================
- name: Ice machine making no ice, sump dry — plugged inlet water filter dropping pressure to zero
  system: vc.ice
  findings: {gen.output: none, rf.ice_sump_level: empty, rf.ice_water_in: none_low}
  expect:
    top: rf.ice_water_supply_off

- name: Ice machine sump dry with full water supply pressure — water inlet solenoid valve failed closed
  system: vc.ice
  findings: {gen.output: none, rf.ice_sump_level: empty, rf.ice_water_in: good, rf.ice_wv_state: failed_closed}
  expect:
    top: rf.ice_inlet_valve_closed

- name: Ice machine slow to freeze with sump overflowing down drain during freeze — inlet water valve weeping
  system: vc.ice
  findings: {gen.output: weak, rf.ice_sump_level: overflowing, rf.ice_wv_state: leaking_through}
  inputs: {rf.freeze_min: 32, rf.freeze_spec_min: 20}
  expect:
    top: rf.ice_inlet_valve_leaking
    measured: {rf.ice_cycle_time: long}

- name: Ice machine stopping on false water-level fault — float switch crusted with mineral scale
  system: vc.ice
  findings: {gen.output: none, rf.ice_sump_level: empty, rf.ice_level_sensor: fouled_stuck}
  expect:
    top: rf.ice_float_probe_fouled

- name: Ice machine sump full in freeze, but no water flowing over evaporator — circulation pump dead
  system: vc.ice
  findings: {gen.output: none, rf.ice_sump_level: full_normal, rf.ice_pump: off_weak}
  expect:
    top: rf.ice_water_pump_failed

- name: Ice machine dropping hollow shell cubes and running sump dry mid-cycle — water curtain hanging crooked
  system: vc.ice
  findings: {gen.output: weak, rf.ice_sump_level: empty, rf.ice_cube_shape: hollow_thin,
    rf.ice_curtain: leaking_bypass}
  expect:
    top: rf.ice_curtain_trough_leak

- name: Ice machine taking 30 min to freeze cloudy cubes that stick in grid — heavy mineral scale on evaporator
  system: vc.ice
  findings: {gen.output: weak, rf.ice_cube_shape: cloudy_stuck, rf.ice_evap_surface: scaled_rough}
  inputs: {rf.freeze_min: 30, rf.freeze_spec_min: 20}
  expect:
    top: rf.ice_evap_scale
    measured: {rf.ice_cycle_time: long}

- name: Ice machine running 34-minute freeze cycles with 82 °F incoming water from galley mixing-valve backfeed
  system: vc.ice
  findings: {gen.output: weak, gen.runs_constantly: 'yes', rf.ice_cube_shape: normal}
  inputs: {rf.freeze_min: 34, rf.freeze_spec_min: 20, rf.ice_water_in_f: 86}
  expect:
    top: rf.ice_warm_water
    measured: {rf.ice_cycle_time: long, rf.ice_water_temp: hot}

- name: Ice machine bridged into a solid 2-inch block of ice and never entering harvest — scaled thickness probe
  system: vc.ice
  findings: {gen.output: none, rf.ice_cube_shape: solid_slab, rf.ice_harvest_init: stuck_in_freeze}
  inputs: {rf.freeze_min: 45}
  expect:
    top: rf.ice_thickness_probe_freezeup
    measured: {rf.ice_cycle_time: long}

- name: Ice machine enters harvest mode, but evaporator stays cold and slab won't drop — hot-gas valve coil open
  system: vc.ice
  findings: {gen.output: none, rf.ice_harvest_init: initiates_no_drop, rf.ice_cube_shape: solid_slab,
    rf.ice_hgv: stuck_closed}
  expect:
    top: rf.ice_hgv_stuck_closed

- name: Ice machine taking 38 min to freeze hollow cubes with hot suction — hot-gas harvest valve leaking in freeze
  system: vc.ice
  findings: {gen.output: weak, vc.evap_sat: high, rf.ice_cube_shape: hollow_thin, rf.ice_hgv: leaking_in_freeze}
  inputs: {rf.freeze_min: 38}
  expect:
    top: rf.ice_hgv_leaking
    measured: {rf.ice_cycle_time: long}

- name: Ice machine warms evaporator in harvest, but slab hangs until timeout — harvest-assist air pump dead
  system: vc.ice
  findings: {gen.output: none, rf.ice_harvest_init: initiates_no_drop, rf.ice_hgv: ok, rf.ice_harvest_assist: failed}
  expect:
    top: rf.ice_harvest_assist_failed

- name: Ice machine sitting idle on Bin Full with an empty bin — curtain reed switch stuck open
  system: vc.ice
  findings: {gen.output: none, vc.comp: 'off', rf.ice_bin_ctrl: faulted}
  expect:
    top: rf.ice_bin_control_fault

# ======================= opening-move scenarios =======================
- name: Opening move — walk-in freezer warm, coil heavily iced, evaporator fans running
  system: vc.walkin
  ctx: {app: lt, defrost: electric}
  findings: {gen.output: weak, rf.box_temp: high, vc.evap_frost: heavy, vc.evap_fan: running}
  expect:
    next_any: [rf.ice_pattern, rf.defrost_init, rf.drain_line, rf.infiltration_path, rf.door_seal]

- name: Opening move — walk-in cooler warm, nothing else entered yet
  system: vc.walkin
  ctx: {app: mt}
  findings: {gen.output: weak, rf.box_temp: high}
  expect:
    next_any: [vc.evap_frost, vc.evap_fan, rf.door_seal, rf.box_loading, rf.ice_pattern, vc.comp]

- name: Opening move — reach-in prep table warm and running nonstop
  system: vc.reachin
  ctx: {app: mt}
  findings: {gen.output: weak, gen.runs_constantly: 'yes', rf.box_temp: high}
  expect:
    next_any: [rf.prep_rail, rf.door_seal, vc.evap_frost, rf.box_loading, vc.cond_dirty]

- name: Opening move — ice machine making no ice at all
  system: vc.ice
  findings: {gen.output: none}
  expect:
    next_any: [rf.ice_sump_level, rf.ice_water_in, rf.ice_cube_shape, vc.comp, rf.ice_bin_ctrl, rf.ice_pump]

- name: Opening move — ice machine slow ice production
  system: vc.ice
  findings: {gen.output: weak}
  expect:
    next_any: [rf.ice_cube_shape, rf.ice_sump_level, rf.ice_evap_surface, rf.ice_water_temp, vc.cond_dirty]

