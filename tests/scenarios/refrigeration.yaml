  expect:
    top: rf.no_hpc_cold

- name: Flooding-valve condensing unit at -30 F, line from the valve to the receiver stays cold and head is low — dome charge lost
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: lt, condenser: air, hpc: flooding, receiver: 'yes'}
  findings: {gen.output: weak, vc.low_ambient: 'yes', vc.cond_sat: low, rf.headmaster_state: no_bypass_cold}
  expect:
    top: rf.headmaster_no_bypass

- name: Fan-cycling condenser fan will not start at high head, high-pressure trips — switch open
  system: vc.walkin
  ctx: {condenser: air, hpc: fan_cycling}
  findings: {gen.output: weak, vc.cond_sat: high, vc.cond_fan: 'off', vc.hps_trip: 'yes', rf.fan_cycle_ctrl: stuck_open}
  expect:
    top: rf.fan_cycling_switch_open

- name: Walk-in freezer, no heater voltage in defrost and the heater branch breaker is tripped
  system: vc.walkin
  ctx: {app: lt, defrost: electric}
  findings: {gen.output: weak, vc.evap_frost: heavy, rf.defrost_init: initiating, rf.defrost_power: missing, gen.breaker: tripped}
  expect:
    top: rf.defrost_heater_breaker

- name: Air-defrost produce cooler, coil iced while the box sits at 31 F and the fans run — off cycle cannot clear the coil
  system: vc.walkin
  ctx: {app: mt, defrost: off_cycle}
  findings: {gen.output: weak, vc.evap_frost: heavy, vc.evap_fan: running, gen.runs_constantly: 'yes'}
  inputs: {rf.box_f: 31, rf.setpoint_f: 36}
  expect:
    top: rf.offcycle_defrost_ineffective
    measured: {rf.box_temp: low}

- name: Hot-gas defrost freezer in cold air — valve opens and the line gets hot, but the coil stays iced and defrost times out
  system: vc.walkin
  ctx: {app: lt, defrost: hot_gas}
  findings: {gen.output: weak, vc.evap_frost: heavy, rf.defrost_init: initiating, rf.hot_gas_valve: normal,
    rf.defrost_term: late_never, vc.low_ambient: 'yes'}
  expect:
    top: rf.hot_gas_defrost_weak

- name: Freezer controller lost its settings in a power blip — probe is accurate, defrost terminates early, coil partly iced
  system: vc.walkin
  ctx: {app: lt, defrost: electric}
  findings: {gen.after_outage: 'yes', gen.output: weak, rf.probe_cal: accurate, rf.defrost_term: early, vc.evap_frost: partial}
  expect:
    top3: [rf.controller_params_wrong]

- name: Produce cooler freezing lettuce at 29 F with an accurate probe — setpoint or control holding it too cold
  system: vc.walkin
  ctx: {app: mt}
  findings: {gen.output: normal, rf.probe_cal: accurate}
  inputs: {rf.box_f: 29, rf.setpoint_f: 36}
  expect:
    top: rf.box_overcooling
    measured: {rf.box_temp: low}

- name: Glycol-cooled condenser, no water-regulating valve, loop pump off — hot glycol, high head, flow lost
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: mt, condenser: water}
  findings: {gen.output: weak, vc.hps_trip: 'yes', rf.wrv_state: normal}
  inputs: {rf.water_in_f: 70, rf.water_out_f: 107, vc.liquid_psig: 250}
  expect:
    top: rf.water_loop_flow_lost
    measured: {rf.water_flow: low_hot}

- name: Freezer drain line freezes again although the heat tape is warm and drawing current
  system: vc.walkin
  ctx: {app: lt, defrost: electric}
  findings: {vc.evap_frost: heavy, rf.ice_pattern: pan_backup, rf.drain_line: frozen, rf.drain_heater: warm_ok}
  expect:
    top: rf.drain_line_ice_plug

- name: Ice machine in an unheated room on 38 F water — slab hangs in harvest although the hot-gas valve opens and the grid is clean
  system: vc.ice
  ctx: {condenser: air}
  findings: {gen.output: weak, rf.ice_harvest_init: initiates_no_drop, rf.ice_hgv: ok, rf.ice_evap_surface: clean}
  inputs: {rf.ice_water_in_f: 38}
  expect:
    top: rf.ice_cold_water_harvest
    measured: {rf.ice_water_temp: cold}

- name: Ice machine slab hangs in harvest with a good hot-gas valve and a thermistor that is loose on its tube
  system: vc.ice
  findings: {gen.output: weak, rf.ice_thermistor: 'off', rf.ice_hgv: ok, rf.ice_harvest_init: initiates_no_drop}
  expect:
    top: rf.ice_harvest_sensor_bad

- name: Ice machine shows a harvest-time safety with the hot-gas valve opening — harvest sensor suspect
  system: vc.ice
  findings: {gen.output: weak, rf.ice_alarm: harvest_safety, rf.ice_hgv: ok}
  expect:
    top3: [rf.ice_harvest_sensor_bad]

- name: Reach-in compressor off, thermostat calling, no solenoid or oil safety on this hermetic unit — those causes must not appear
  system: vc.reachin
  ctx: {app: mt}
  findings: {gen.output: none, vc.comp: 'off', gen.call: calling}
  expect:
    top3: [vc.contactor]   # with power not yet checked, no line power can lead
    not_top3: [rf.llsv_stuck_closed, rf.oil_safety_lockout]
