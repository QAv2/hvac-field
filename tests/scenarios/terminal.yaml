# Scenario suite for terminal heating units (kb/terminal.yaml).
# Every tu.* cause is the expected answer of at least one scenario, the common ones of two. Each scenario
# enters what a tech would have found by then — the complaint, a few cheap looks, and the check that
# settles it — not the cause's whole signature. Opening moves check that the first suggestions are
# cheap and sensible; the measure scenarios run the three tu.* calculations from raw readings.

# ==================== OPENING MOVES ====================
- name: Unit heater blowing cold (opening move)
  system: terminal
  ctx: {tu_type: unit_heater, tu_heat: water}
  findings: {tu.fan: running, gen.output: none}
  # with the fan-delay switch working, a fan that runs says the supply ahead of the valve is hot, so the
  # valve and the coil lead; the cheap looks at the valve and the pipe come first
  expect:
    not_top: [_ok]
    next_any: [tu.supply_pipe, tu.coil_dt, hyd.air_bleed, hyd.zone_valve]

- name: Fan coil not heating, type of heat unknown (opening move)
  system: terminal
  ctx: {tu_type: fcu2}
  findings: {gen.output: none}
  expect:
    next_any: [tu.fan, tu.supply_pipe, gen.call]

- name: Unit heater coil hot but no fan (opening move)
  system: terminal
  ctx: {tu_type: unit_heater, tu_heat: water}
  findings: {tu.fan: 'off', gen.output: weak, tu.supply_pipe: hot}
  expect:
    next_any: [tu.fan_volts, tu.fan_interlock, tu.freezestat, tu.fan_spin]
    not_top3: [tu.no_source]

- name: Electric baseboard cold (opening move)
  system: terminal
  ctx: {tu_type: baseboard, tu_heat: electric}
  findings: {gen.output: none}
  expect:
    next_any: [gen.breaker, gen.power, tu.lv_tstat, gen.call, tu.heat_amps]

- name: Steam unit heater cold, steam main hot (opening move)
  system: terminal
  ctx: {tu_type: unit_heater, tu_heat: steam}
  findings: {gen.output: none, tu.supply_pipe: hot}
  expect:
    next_any: [hyd.trap_check, tu.coil_pattern, hyd.rad_valve, hyd.zone_valve, tu.coil_dt]
    not_top3: [tu.no_source]

- name: Baseboard weak in one room, hot water loop fine elsewhere (opening move)
  system: terminal
  ctx: {tu_type: baseboard, tu_heat: water}
  findings: {gen.output: weak, hyd.scope: one_zone}
  expect:
    next_any: [tu.fins, tu.coil_pattern, tu.supply_pipe, hyd.air_bleed]

