  ctx: {tu_type: baseboard, tu_heat: steam}
  findings: {gen.output: none, tu.supply_pipe: cold, hyd.scope: whole_loop}
  expect:
    top: tu.no_source

- name: 2-pipe fan coil blowing cold in October, supply pipe sweating
