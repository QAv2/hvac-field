- name: Vacuum pegged in the cold, filter clean, fuel clear, vent not looked at yet — look at the vent
  system: fuel.boiler
  ctx: {fuel_type: no2, flame_sensor: cad, boiler_kind: hw}
  findings: {blr.cold: cold, blr.line_cold: 'yes', blr.pump_vac: high, blr.filter: clean, blr.fuel_sample: clear, blr.tank: ok,
    blr.start: flame_lost}
  expect:
    top3: [blr.tank_vent_blocked, blr.line_frozen]
