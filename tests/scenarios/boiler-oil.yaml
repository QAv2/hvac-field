# ---------------- fuel unit and readings ----------------
- name: One-pipe unit lifting 7 ft pulls 9 in. Hg — over the one-pipe limit, pump noisy
  system: fuel.boiler
  ctx: {fuel_type: no2, flame_sensor: cad, boiler_kind: hw, oil_piping: one_pipe}
  findings: {blr.pump_noise: noisy, blr.start: flame_lost, blr.lockout: once}
  inputs: {blr.pump_vac_inhg: 9, blr.lift_ft: 7}
  expect:
    top: blr.supply_restricted
    measured: {blr.pump_vac: high}

- name: Two-stage pump pulling 13 in. Hg on 6 ft of lift is normal for that pump
  system: fuel.boiler
  ctx: {fuel_type: no2, flame_sensor: cad, boiler_kind: hw, oil_piping: two_stage}
  findings: {blr.lockout: 'no'}
  inputs: {blr.pump_vac_inhg: 13, blr.lift_ft: 6}
  expect:
    measured: {blr.pump_vac: normal}

- name: Two-pipe single-stage pump pulling 14 in. Hg on 8 ft of lift is over its limit
