- name: Deep cold, kerosene, motor hums on cold starts, vacuum high, no wax anywhere
  system: fuel.boiler
  ctx: {fuel_type: kero, flame_sensor: cad, boiler_kind: hw}
  findings: {blr.cold: extreme, blr.motor: hums_bound, blr.start: nothing, blr.pump_vac: high, blr.fuel_sample: clear,
    blr.filter: clean, blr.line_cold: 'yes'}
  expect:
    top: blr.cold_thick_fuel
    not_top: [blr.pump_seized]

- name: Burner draws outside air, −40 °F, stringy flame, O2 8.2 %, rough light-off
  system: fuel.boiler
