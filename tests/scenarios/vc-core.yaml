# Scenario tests for the vapor-compression core. Each case is a service call: what the tech typed or
# saw (findings), what the gauges and probes read (inputs → measures), and where the engine must land.
# expect.top = must be #1 · top3 = must be in the top three · measured = what the numbers must classify as
# · next_any = one of the first three suggested checks must be among these.

- name: A/C piston, low charge from the gauges alone
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: fixed, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 95, vc.air_in_f: 78, vc.air_in_rh: 50, vc.air_out_f: 65,
    vc.suction_psig: 101, vc.suction_line_f: 60, vc.liquid_psig: 313, vc.liquid_line_f: 97}
  expect:
    top: vc.undercharge
    measured: {vc.superheat: high, vc.subcool: low, vc.cond_sat: low, vc.evap_sat: low, vc.evap_split: low}

- name: A/C piston, overcharged after a top-off
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: fixed, sh_location: comp, condenser: air}
  findings: {gen.recent_work: 'yes'}
  inputs: {vc.ambient_f: 85, vc.air_in_f: 75, vc.air_in_rh: 50, vc.suction_psig: 142.6, vc.suction_line_f: 53,
    vc.liquid_psig: 392, vc.liquid_line_f: 96}
  expect:
    top: vc.overcharge
    measured: {vc.superheat: low, vc.subcool: high}

- name: A/C TXV, dirty condenser
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air, ac_eff: standard}
  findings: {vc.cond_dirty: 'yes'}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 76, vc.suction_psig: 133, vc.suction_line_f: 58, vc.liquid_psig: 482,
    vc.liquid_line_f: 118}
  expect:
    top: vc.dirty_condenser
    measured: {vc.cond_sat: high, vc.superheat: normal}

- name: A/C TXV, plugged filter-drier
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 76, vc.suction_psig: 95, vc.suction_line_f: 55, vc.liquid_psig: 341,
    vc.liquid_line_f: 86, vc.drier_in_f: 92, vc.drier_out_f: 83}
  expect:
    top: vc.liquid_restriction
    measured: {vc.superheat: high, vc.subcool: high, vc.drier_dt: high}

- name: A/C TXV, starving with no drier drop → valve is a contender
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 76, vc.suction_psig: 95, vc.suction_line_f: 55, vc.liquid_psig: 341,
    vc.liquid_line_f: 86, vc.drier_in_f: 88, vc.drier_out_f: 87.5}
  expect:
    top3: [vc.txv_underfeed]

- name: A/C, dirty filter and iced coil
  system: vc.ac
  findings: {gen.output: weak, vc.filter: dirty, vc.evap_frost: heavy}
  expect:
    top: vc.dirty_filter

- name: A/C, blower dead, coil iced
  system: vc.ac
  findings: {gen.output: none, vc.evap_fan: 'off', vc.evap_frost: heavy}
  expect:
    top: vc.evap_fan_off

- name: Compressor hums and trips, capacitor tests low
  system: vc.ac
  findings: {vc.comp: hums, vc.cap: bad}
  expect:
    top: vc.comp_cap

- name: Unit dead, no voltage at the disconnect
  system: vc.ac
  findings: {gen.dead: 'yes', gen.power: missing}
  expect:
    top: gen.no_line_power

- name: Calling, contactor won't pull in, no 24 V at its coil
  system: vc.ac
  findings: {gen.output: none, vc.comp: 'off', vc.cond_fan: 'off', vc.contactor: not_pulling, vc.coil_24v: 'no',
    gen.call: calling}
  expect:
    top: vc.safety_open

- name: Calling, 24 V on the coil but contactor won't pull in
  system: vc.ac
  findings: {gen.output: none, vc.comp: 'off', vc.contactor: not_pulling, vc.coil_24v: 'yes'}
  expect:
    top: vc.contactor

- name: Water on the floor, pan full
  system: vc.ac
  findings: {gen.water_leak: 'yes', vc.drain: clogged}
  expect:
    top: vc.drain_clogged

- name: Air in the system after a repair (standing pressure test)
  system: vc.ac
  ctx: {refrigerant: R-410A}
  findings: {gen.recent_work: 'yes'}
  inputs: {vc.standing_psig: 232, vc.standing_temp_f: 70}
  expect:
    top: vc.noncondensables
    measured: {vc.standing: high}

- name: Compressor not pumping (TXV)
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak, vc.pumpdown: weak}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 75, vc.suction_psig: 155, vc.suction_line_f: 66, vc.liquid_psig: 300,
    vc.comp_amps_meas: 8, vc.comp_rla: 18}
  expect:
    top: vc.comp_inefficient
    measured: {vc.evap_sat: high, vc.cond_sat: low, vc.comp_amps: low}

- name: Short cycling with normal pressures and no safety trips
  system: vc.ac
  findings: {gen.short_cycle: 'yes', vc.lps_trip: 'no', vc.hps_trip: 'no', vc.comp_hot: 'no'}
  expect:
    top3: [vc.control_cycling]

- name: Server-room A/C icing in cold weather
  system: vc.ac
  ctx: {condenser: air}
  findings: {vc.low_ambient: 'yes', vc.evap_frost: heavy, vc.filter: clean, vc.evap_fan: running}
  expect:
    top: vc.low_ambient

- name: Condenser drifted in with snow
  system: vc.walkin
  ctx: {condenser: air}
  findings: {vc.cond_airpath: blocked, vc.hps_trip: 'yes'}
  expect:
    top: vc.cond_blocked

- name: Opening move — weak cooling, nothing else known → cheap looks come first
  system: vc.ac
  findings: {gen.output: weak}
  expect:
    next_any: [vc.filter, vc.evap_frost, vc.cond_dirty, vc.evap_fan, vc.cond_fan, vc.comp, vc.drain, vc.cond_airpath]

- name: Refrigerant identifier says mixed after someone topped it off
  system: vc.walkin
  findings: {vc.identifier: mixed, gen.recent_work: 'yes'}
  expect: {top: vc.wrong_refrigerant}

- name: TXV flooding — low superheat, sweating compressor, bulb hanging loose
  system: vc.walkin
  ctx: {metering: txv}
  findings: {vc.superheat: low, vc.comp_sweat: 'yes', vc.bulb_mount: poor}
  expect: {top: vc.txv_overfeed}

- name: New coil, wrong piston — low superheat and low subcooling
  system: vc.ac
  ctx: {metering: fixed}
  findings: {gen.recent_work: 'yes', vc.superheat: low, vc.subcool: low, vc.evap_sat: high}
  expect: {top3: [vc.piston_large]}

- name: Cap-tube reach-in starving — high superheat, high subcooling, no drier drop
  system: vc.reachin
  ctx: {metering: captube}
  findings: {gen.output: weak, vc.superheat: high, vc.subcool: high, vc.drier_dt: normal}
  expect: {top3: [vc.metering_small]}

- name: Wet moisture indicator, feed comes and goes
  system: vc.walkin
  findings: {vc.moisture_ind: wet, gen.intermittent: 'yes'}
  expect: {top: vc.moisture}

- name: Matted evaporator, big temperature split
  system: vc.ac
  findings: {gen.output: weak, vc.evap_dirty: 'yes', vc.evap_split: high}
  expect: {top: vc.dirty_evap}

- name: Blower turning but weak, filter and coil clean
  system: vc.ac
  findings: {gen.output: weak, vc.evap_fan: weak, vc.filter: clean, vc.evap_dirty: 'no'}
  expect: {top: vc.evap_fan_weak}

- name: Closed registers and high static
  system: vc.ac
  findings: {vc.ducts: restricted, vc.static: high, vc.filter: clean}
  expect: {top: vc.duct_restriction}

- name: Return duct pulled loose in the attic
  system: vc.ac
  findings: {gen.output: weak, vc.ducts: leaking}
  expect: {top: vc.duct_leak}

- name: Runs nonstop on a hot day, everything high but in proportion (TXV)
  system: vc.ac
  ctx: {metering: txv}
  findings: {gen.runs_constantly: 'yes', vc.evap_sat: high, vc.cond_sat: high, vc.superheat: normal, vc.filter: clean}
  expect: {top3: [vc.excess_load]}

- name: Condenser fan stopped, head pressure way up
  system: vc.walkin
  ctx: {condenser: air}
  findings: {vc.cond_fan: 'off', vc.cond_sat: high}
  expect: {top3: [vc.cond_fan_failed, vc.fan_cap]}

- name: Condenser fan crawling, capacitor fine
  system: vc.ac
  findings: {vc.cond_fan: slow, vc.cap: ok, vc.cond_sat: high}
  expect: {top: vc.cond_fan_slow}

- name: Condenser fan hums, capacitor tests low
  system: vc.ac
  findings: {vc.cond_fan: 'off', vc.cap: bad, vc.comp: running}
  expect: {top: vc.fan_cap}

- name: Compressor hums on a good capacitor with good windings
  system: vc.ac
  findings: {vc.comp: hums, vc.cap: ok, vc.windings: ok}
  expect: {top3: [vc.comp_locked], next_any: [vc.contactor, vc.start_parts]}

- name: Compressor terminal reads to ground, breaker trips again
  system: vc.ac
  findings: {vc.comp: 'off', vc.windings: grounded, gen.breaker: retrips}
  expect: {top: vc.comp_windings}

- name: Compressor too hot to touch, cycling on its overload
  system: vc.walkin
  findings: {vc.comp_hot: 'yes', gen.short_cycle: 'yes', vc.windings: overload_open}
  expect: {top3: [vc.overheat_overload]}

# ---------------------------------------------------------------------------------------------------------------
# Added with the core review: three-phase supply, start devices, suction restriction, a welded contactor, and the
# measures that used to call healthy equipment faulty (freezers read at the compressor, cool weather, hot-day R-22).

- name: Three-phase compressor hums with one leg dead at the contactor
  system: vc.walkin
  ctx: {phases: three}
  findings: {gen.output: none, vc.comp: hums, gen.power: present, vc.phase: phase_loss}
  expect: {top: vc.single_phase}

- name: Three-phase compressor hums, line voltage present — the three-leg check comes early
  system: vc.walkin
  ctx: {phases: three}
  findings: {gen.output: none, vc.comp: hums, gen.power: present}
  expect:
    top3: [vc.single_phase]
    next_any: [vc.phase]

- name: Rooftop scroll weak right after the generator transfer, rotation not yet checked
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air, phases: three}
  findings: {gen.output: weak, gen.after_outage: 'yes'}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 75, vc.suction_psig: 155, vc.suction_line_f: 66, vc.liquid_psig: 300,
    vc.comp_amps_meas: 8, vc.comp_rla: 18}
  expect:
    top: vc.phase_reversed
    top3: [vc.comp_inefficient]
    next_any: [gen.recent_work, vc.rotation]
    measured: {vc.evap_sat: high, vc.cond_sat: low, vc.comp_amps: low}

- name: Same scroll after the generator transfer, phase-sequence tester reads reversed
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air, phases: three}
  findings: {gen.output: weak, gen.after_outage: 'yes', vc.rotation: reversed}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 75, vc.suction_psig: 155, vc.suction_line_f: 66, vc.liquid_psig: 300,
    vc.comp_amps_meas: 8, vc.comp_rla: 18}
  expect: {top: vc.phase_reversed}

- name: Same weak scroll after the transfer, but the rotation proves correct — the compressor really is worn
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air, phases: three}
  findings: {gen.output: weak, gen.after_outage: 'yes', vc.rotation: correct, vc.pumpdown: weak}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 75, vc.suction_psig: 155, vc.suction_line_f: 66, vc.liquid_psig: 300,
    vc.comp_amps_meas: 8, vc.comp_rla: 18}
  expect: {top: vc.comp_inefficient}

- name: Reach-in compressor hums and trips, run capacitor and windings good, start relay tests bad
  system: vc.reachin
  ctx: {phases: single}
  findings: {gen.output: none, vc.comp: hums, vc.cap: ok, vc.windings: ok, vc.start_parts: bad}
  expect: {top: vc.start_relay}

- name: Single-phase hummer with a good run capacitor and good windings — the start parts are the next look
  system: vc.reachin
  ctx: {phases: single}
  findings: {gen.output: none, vc.comp: hums, vc.cap: ok, vc.windings: ok}
  expect:
    top3: [vc.start_relay]
    next_any: [vc.start_parts]

- name: Weak cooling right after service — suction service valve not back-seated
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak, gen.recent_work: 'yes'}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 76, vc.suction_psig: 92, vc.suction_line_f: 52, vc.liquid_psig: 300.7,
    vc.liquid_line_f: 86, vc.comp_amps_meas: 8, vc.comp_rla: 18}
  expect:
    top: vc.suction_restriction
    measured: {vc.superheat: high, vc.subcool: normal, vc.evap_sat: low, vc.cond_sat: low, vc.comp_amps: low}

- name: Unit keeps running with the thermostat satisfied and the contactor is stuck in
  system: vc.ac
  findings: {gen.call: not_calling, vc.comp: running, vc.contactor: welded}
  expect: {top: vc.contactor_welded}

- name: Unit runs with no call for cooling — the contactor is the next look
  system: vc.ac
  findings: {gen.call: not_calling, vc.comp: running}
  expect:
    top: vc.contactor_welded
    next_any: [vc.contactor]

- name: Healthy low-temp walk-in read at the compressor — superheat 48 °F and amps at 41 % of RLA are normal there
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: lt, metering: txv, condenser: air, hpc: flooding, receiver: 'yes', sh_location: comp}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 40, vc.air_in_f: -10, vc.suction_psig: 14.6, vc.suction_line_f: 26, vc.liquid_psig: 192.5,
    vc.liquid_line_f: 71, vc.comp_amps_meas: 6.5, vc.comp_rla: 16}
  expect:
    not_top: [vc.undercharge]
    measured: {vc.superheat: normal, vc.subcool: normal, vc.comp_amps: normal}

- name: Starved low-temp walk-in — superheat 85 °F at the compressor and bubbles in the sight glass
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: lt, metering: txv, condenser: air, hpc: flooding, receiver: 'yes', sh_location: comp}
  findings: {gen.output: weak, vc.sight_glass: bubbles}
  inputs: {vc.ambient_f: 40, vc.air_in_f: -10, vc.suction_psig: 14.6, vc.suction_line_f: 63, vc.liquid_psig: 192.5,
    vc.liquid_line_f: 86, vc.comp_amps_meas: 6.5, vc.comp_rla: 16}
  expect:
    top: vc.undercharge
    measured: {vc.superheat: high}

- name: Medium-temp walk-in with the suction line read at the condensing unit and the location not answered
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: mt, metering: txv, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.air_in_f: 36, vc.suction_psig: 60.7, vc.suction_line_f: 50}
  expect:
    not_top: [vc.undercharge]
    measured: {vc.superheat: normal, vc.evap_sat: normal}

- name: Moderately dirty condenser — head high, but the discharge line and amps still read in range
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak, vc.cond_fan: running}
  inputs: {vc.ambient_f: 95, vc.air_in_f: 80, vc.suction_psig: 130.1, vc.suction_line_f: 59, vc.liquid_psig: 496.8,
    vc.liquid_line_f: 124, vc.discharge_line_f: 215, vc.comp_amps_meas: 17.5, vc.comp_rla: 18}
  expect:
    top: vc.dirty_condenser
    next_any: [vc.cond_dirty]
    measured: {vc.cond_sat: high, vc.discharge_temp: normal, vc.comp_amps: normal}

- name: Walk-in condensing unit with a moderately dirty coil — head high, discharge line and amps in range
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: mt, metering: txv, sh_location: evap, condenser: air, hpc: flooding, receiver: 'yes'}
  findings: {gen.output: weak, vc.cond_fan: running}
  inputs: {vc.ambient_f: 90, vc.air_in_f: 36, vc.suction_psig: 60.7, vc.suction_line_f: 32, vc.liquid_psig: 346.6,
    vc.liquid_line_f: 118, vc.discharge_line_f: 205, vc.comp_amps_meas: 14.4, vc.comp_rla: 16}
  expect:
    top3: [vc.dirty_condenser]
    measured: {vc.cond_sat: high, vc.discharge_temp: normal, vc.comp_amps: normal}

- name: Mild TXV shortage — subcooling 5 °F with everything else in range
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 95, vc.air_in_f: 80, vc.suction_psig: 130.1, vc.suction_line_f: 57, vc.liquid_psig: 392.3,
    vc.liquid_line_f: 110}
  expect:
    top: vc.undercharge
    measured: {vc.subcool: low, vc.superheat: normal}

- name: TXV A/C on a 60 °F day with subcooling 16 °F — normal in cool weather, not an overcharge
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.recent_work: 'yes'}
  inputs: {vc.ambient_f: 60, vc.air_in_f: 76, vc.suction_psig: 120.7, vc.suction_line_f: 53, vc.liquid_psig: 243.9,
    vc.liquid_line_f: 66}
  expect:
    not_top: [vc.overcharge]
    measured: {vc.subcool: normal, vc.cond_sat: normal}

- name: Piston A/C at 95 °F with subcooling 17 °F — a result, not a target, on a fixed orifice
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: fixed, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 95, vc.air_in_f: 78, vc.air_in_rh: 50, vc.suction_psig: 118.4, vc.suction_line_f: 53,
    vc.liquid_psig: 392.3, vc.liquid_line_f: 98}
  expect:
    measured: {vc.subcool: normal, vc.superheat: normal}

- name: Piston A/C at 40 °F outdoors with the head collapsed to 62 °F — low against the condensing floor
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: fixed, sh_location: comp, condenser: air}
  findings: {gen.output: weak, vc.evap_frost: heavy}
  inputs: {vc.ambient_f: 40, vc.air_in_f: 75, vc.air_in_rh: 50, vc.suction_psig: 89.2, vc.suction_line_f: 34,
    vc.liquid_psig: 176.6, vc.liquid_line_f: 54}
  expect:
    measured: {vc.cond_sat: low, vc.evap_sat: low}
    unmeasured: [vc.superheat]   # the fixed-orifice superheat method doesn't hold below 55 °F outdoors

- name: Outdoor walk-in unit in a deep freeze with no head-pressure control — a collapsed head reads low
  system: vc.walkin
  ctx: {refrigerant: R-404A, app: mt, metering: txv, sh_location: evap, condenser: air, hpc: none}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: -10, vc.air_in_f: 36, vc.suction_psig: 55.3, vc.suction_line_f: 28, vc.liquid_psig: 95.8,
    vc.liquid_line_f: 40}
  expect:
    not_top: [vc.dirty_condenser]
    measured: {vc.cond_sat: low}

- name: Clean R-22 condensing unit on a 115 °F day — a 245 °F discharge line is normal for a 140 °F head
  system: vc.ac
  ctx: {refrigerant: R-22, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 115, vc.air_in_f: 80, vc.liquid_psig: 337.4, vc.liquid_line_f: 130, vc.discharge_line_f: 245}
  expect:
    not_top: [vc.dirty_condenser]
    measured: {vc.cond_sat: normal, vc.discharge_temp: normal}

- name: R-410A at 75 °F outdoors with a 200 °F discharge line against a 100 °F head — high, though under 225 °F
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak}
  inputs: {vc.ambient_f: 75, vc.air_in_f: 78, vc.liquid_psig: 318.5, vc.liquid_line_f: 90, vc.discharge_line_f: 200}
  expect:
    measured: {vc.cond_sat: normal, vc.discharge_temp: high}

- name: Discharge line 255 °F with no head-pressure reading — over the 250 °F oil alarm
  system: vc.ac
  findings: {gen.output: weak}
  inputs: {vc.discharge_line_f: 255}
  expect:
    measured: {vc.discharge_temp: high}

- name: Runs nonstop on a 105 °F day with every reading in proportion to the weather
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv, sh_location: comp, condenser: air}
  findings: {gen.output: weak, gen.runs_constantly: 'yes', vc.filter: clean}
  inputs: {vc.ambient_f: 105, vc.air_in_f: 82, vc.suction_psig: 145.2, vc.suction_line_f: 63, vc.liquid_psig: 484.2,
    vc.liquid_line_f: 121}
  expect:
    top: vc.excess_load
    measured: {vc.evap_sat: normal, vc.cond_sat: normal, vc.superheat: normal}

- name: Short cycling is the only complaint — a dirty coil and the controls come before a failed fan
  system: vc.ac
  findings: {gen.short_cycle: 'yes'}
  expect:
    top3: [vc.dirty_condenser, vc.control_cycling]
    not_top: [vc.cond_fan_failed]

- name: Weak run capacitor — the compressor still starts, runs hot and trips on its overload
  system: vc.ac
  findings: {vc.comp: running, vc.cap: bad, vc.comp_hot: 'yes', gen.output: weak, vc.cond_fan: running}
  expect: {top3: [vc.comp_cap]}

# --- readings past a physical limit: which ones count (measure.js checkSanity) ----------------------------
# Near the limit the warning shows and the readings still count; only well past it are they left out.
- name: Readings — R-448A walk-in flooding, suction line between the bubble and dew points still counts
  system: vc.walkin
  ctx: {refrigerant: R-448A, metering: txv, sh_location: evap}
  inputs: {vc.suction_psig: 43.9, vc.suction_line_f: 17}
  findings: {vc.comp_sweat: 'yes'}
  expect:
    measured: {vc.superheat: low}
    top3: [vc.txv_overfeed]

- name: Readings — suction line far below the bubble point is a bad reading and is left out
  system: vc.walkin
  ctx: {refrigerant: R-448A, metering: txv, sh_location: evap}
  inputs: {vc.suction_psig: 43.9, vc.suction_line_f: -2}
  expect:
    unmeasured: [vc.superheat, vc.evap_sat]

- name: Readings — almost empty R-410A system, vapor leaving the condenser still counts
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv}
  inputs: {vc.ambient_f: 95, vc.suction_psig: 60, vc.suction_line_f: 75, vc.liquid_psig: 150, vc.liquid_line_f: 93}
  expect:
    measured: {vc.subcool: low, vc.cond_sat: low, vc.superheat: high}
    top3: [vc.undercharge]

- name: Readings — condensing unit with the liquid-line probe in the sun, far over saturation, is left out
  system: vc.ac
  ctx: {refrigerant: R-410A, metering: txv}
  inputs: {vc.ambient_f: 95, vc.suction_psig: 125, vc.suction_line_f: 52, vc.liquid_psig: 340, vc.liquid_line_f: 120}
  expect:
    unmeasured: [vc.subcool]

# --- receiver level (vc.receiver_level) ------------------------------------------------------------------
- name: Walk-in box warm, receiver near empty and the sight glass foaming
  system: vc.walkin
  findings: {rf.box_temp: high, vc.receiver_level: low, vc.sight_glass: bubbles}
  expect: {top: vc.undercharge}

- name: Walk-in after a recharge, receiver full above the top glass and head pressure high
  system: vc.walkin
  findings: {gen.recent_work: 'yes', vc.receiver_level: full, vc.cond_sat: high}
  expect: {top: vc.overcharge}
